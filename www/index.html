<style>
  :root{
    --bg:#EEF3FA;
    --surface:#FFFFFF;
    --surface-2:#E3EBF6;
    --border:#CBD8EA;
    --ink:#10233F;
    --ink-soft:#4C6180;
    --ink-faint:#8598B3;
    --accent:#0B63C4;
    --accent-ink:#F3F7FC;
    --accent-soft:#DCE9FA;
    --warm:#3A5786;
    --warm-soft:#E4EAF4;
    --good:#2E8B6B;
    --good-soft:#E0F0EA;
    --warn:#B8862B;
    --warn-soft:#F5EBD6;
    --critical:#B5473C;
    --critical-soft:#F6E1DE;
    --holiday:#C0264F;
    --holiday-soft:#F7DCE5;
    --wfh:#4A4FB0;
    --wfh-soft:#E5E6F7;
    --shadow: 0 1px 2px rgba(16,35,63,0.07), 0 6px 20px -8px rgba(16,35,63,0.18);
    --focus:#0B63C4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1626;
      --surface:#15223A;
      --surface-2:#1C2C48;
      --border:#2E4164;
      --ink:#E7EEF8;
      --ink-soft:#A7B7CE;
      --ink-faint:#7C8CA8;
      --accent:#6FA8E8;
      --accent-ink:#0B1B30;
      --accent-soft:#1F3B5C;
      --warm:#93AAD3;
      --warm-soft:#233350;
      --good:#74C39B;
      --good-soft:#1E3327;
      --warn:#DCB265;
      --warn-soft:#362A16;
      --critical:#E28A7E;
      --critical-soft:#3B211E;
      --holiday:#EA92AC;
      --holiday-soft:#3A1C28;
      --wfh:#A3AAF0;
      --wfh-soft:#28305C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1626;
    --surface:#15223A;
    --surface-2:#1C2C48;
    --border:#2E4164;
    --ink:#E7EEF8;
    --ink-soft:#A7B7CE;
    --ink-faint:#7C8CA8;
    --accent:#6FA8E8;
    --accent-ink:#0B1B30;
    --accent-soft:#1F3B5C;
    --warm:#93AAD3;
    --warm-soft:#233350;
    --good:#74C39B;
    --good-soft:#1E3327;
    --warn:#DCB265;
    --warn-soft:#362A16;
    --critical:#E28A7E;
    --critical-soft:#3B211E;
    --holiday:#EA92AC;
    --holiday-soft:#3A1C28;
    --wfh:#A3AAF0;
    --wfh-soft:#28305C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; -webkit-tap-highlight-color:transparent;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
  }

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-mark{width:26px; height:26px; color:var(--accent); flex:none;}
  .brand-mark rect{fill:none; stroke:currentColor; stroke-width:1.7;}
  .brand-mark line{stroke:currentColor; stroke-width:1.7;}
  .brand-mark polyline{fill:none; stroke:var(--warm); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
  .brand-name{font-family:"Fraunces", serif; font-weight:600; font-size:18px; letter-spacing:-0.01em;}
  .fy-chip{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:600;
    color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--border);
    padding:5px 9px; border-radius:99px; white-space:nowrap;
  }
  .topbar-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .help-btn{
    width:29px; height:29px; border-radius:99px; flex:none;
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .help-btn svg{width:15px; height:15px;}
  .help-btn:active{background:var(--accent-soft); color:var(--accent);}
  .notif-btn{position:relative;}
  .notif-badge{
    position:absolute; top:-4px; right:-4px; min-width:15px; height:15px; padding:0 3px;
    border-radius:99px; background:var(--critical); color:#fff; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1; font-family:"IBM Plex Mono", monospace;
    border:1.5px solid var(--surface);
  }
  .notif-badge.hidden{display:none;}

  /* Notification center */
  .notif-item{display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:color-mix(in srgb, var(--accent-soft) 45%, transparent); margin:0 -18px; padding:12px 18px; border-radius:10px;}
  .notif-icon{
    width:32px; height:32px; border-radius:99px; flex:none; display:flex; align-items:center; justify-content:center;
  }
  .notif-icon svg{width:16px; height:16px;}
  .notif-icon.t-error{background:var(--critical-soft); color:var(--critical);}
  .notif-icon.t-update{background:var(--accent-soft); color:var(--accent);}
  .notif-icon.t-bug{background:var(--warn-soft); color:var(--warn);}
  .notif-body{flex:1; min-width:0;}
  .notif-title{font-size:13.5px; font-weight:600;}
  .notif-msg{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
  .notif-time{font-size:11px; color:var(--ink-faint); margin-top:4px; font-family:"IBM Plex Mono", monospace;}
  .notif-empty{text-align:center; padding:36px 10px; color:var(--ink-faint); font-size:13.5px;}

  /* Pull-to-refresh: an expanding bar under the topbar, driven by touch
     drag distance in JS. Zero height / hidden until pulled. */
  .ptr-bar{
    height:0; overflow:hidden; opacity:0;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface-2); color:var(--ink-soft);
    font-size:12px; font-weight:600;
    transition:height .18s ease, opacity .18s ease;
  }
  .ptr-spinner{
    width:14px; height:14px; border-radius:99px; flex:none;
    border:2px solid var(--ink-faint); border-top-color:var(--accent);
    animation:ptr-spin .7s linear infinite;
  }
  @keyframes ptr-spin{to{transform:rotate(360deg);}}

  main{flex:1; padding:16px 16px 8px; display:flex; flex-direction:column; gap:14px;}
  .view{display:none; flex-direction:column; gap:14px; animation:fade-in .18s ease;}
  .view.active{display:flex;}
  @keyframes fade-in{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .page-title{font-size:22px;}
  .subtext{color:var(--ink-soft); font-size:13.5px; line-height:1.5;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:0;}
  @keyframes flash-highlight{
    0%{box-shadow:0 0 0 3px var(--accent), var(--shadow);}
    100%{box-shadow:0 0 0 0px transparent, var(--shadow);}
  }
  .flash-highlight{animation:flash-highlight 1.1s ease;}
  .card-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}

  /* Banners */
  .banner{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--warm-soft); border:1px solid color-mix(in srgb, var(--warm) 35%, var(--border));
    border-radius:14px; padding:12px 14px; font-size:13.5px; line-height:1.45;
  }
  .banner .banner-text{flex:1;}
  .banner strong{display:block; font-weight:600; margin-bottom:2px; color:var(--ink);}
  .banner-actions{display:flex; gap:8px; margin-top:8px;}
  .banner-btn{
    border:none; background:var(--warm); color:#fff; font-weight:600; font-size:12.5px;
    padding:6px 11px; border-radius:8px; cursor:pointer;
  }
  .banner-dismiss{
    border:none; background:transparent; color:var(--ink-faint); cursor:pointer;
    font-size:16px; line-height:1; padding:2px 4px;
  }

  /* Ring */
  .ring-wrap{position:relative; width:150px; height:150px; margin:0 auto; flex:none;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-pct{font-family:"IBM Plex Mono", monospace; font-size:30px; font-weight:600; line-height:1;}
  .ring-label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;}

  .stat-hero{display:flex; align-items:center; gap:18px;}
  .stat-hero-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;}
  .stat-chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    background:var(--surface-2); border-radius:10px; padding:7px 10px; flex:1; min-width:74px;
  }
  .stat-chip .n{font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:16px; display:block;}
  .stat-chip .l{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}

  /* Home hero card — swipeable between "this month" and the FY aggregate */
  .stat-hero-card{padding:0; overflow:hidden;}
  .stat-hero-track{display:flex; width:200%; touch-action:pan-y; transition:transform .32s cubic-bezier(.2,.8,.3,1);}
  .stat-hero-slide{width:50%; flex:none; padding:18px; box-sizing:border-box;}
  .stat-hero-dots{display:flex; justify-content:center; gap:6px; padding:0 0 14px;}
  .stat-hero-dot{width:6px; height:6px; border-radius:99px; background:var(--border); transition:all .2s ease;}
  .stat-hero-dot.on{background:var(--accent); width:16px; border-radius:4px;}

  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:99px;
  }
  .status-good{background:var(--good-soft); color:var(--good);}
  .status-warn{background:var(--warn-soft); color:var(--warn);}
  .status-critical{background:var(--critical-soft); color:var(--critical);}

  .to-target{font-size:14.5px; line-height:1.55;}
  .to-target b{font-family:"IBM Plex Mono", monospace; font-weight:600;}

  .btn{
    border:none; border-radius:11px; padding:11px 16px; font-weight:600; font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
  .btn-danger{background:var(--critical-soft); color:var(--critical);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}

  /* Calendar */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cal-nav-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--ink);
  }
  .cal-nav-btn svg{width:16px; height:16px;}
  .cal-month-label{font-family:"Fraunces", serif; font-weight:600; font-size:17px; text-align:center;}
  .cal-today-link{font-size:11.5px; color:var(--accent); font-weight:600; background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:12px;}
  .cal-dow{font-size:10px; text-align:center; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace; font-size:13px; font-weight:500; cursor:pointer;
    background:var(--surface-2); color:var(--ink); position:relative; border:1.5px solid transparent;
  }
  .cal-cell.empty{visibility:hidden; cursor:default;}
  .cal-cell.is-today{border-color:var(--accent);}
  .cal-cell .dot{width:5px; height:5px; border-radius:99px; margin-top:3px;}
  .cal-cell.st-present{background:var(--good-soft); color:var(--good);}
  .cal-cell.st-workedWeekend{background:var(--good-soft); color:var(--good);}
  .cal-cell.st-leave{background:var(--warn-soft); color:var(--warn);}
  .cal-cell.st-holiday{background:var(--holiday-soft); color:var(--holiday);}
  .cal-cell.st-compoff{background:var(--accent-soft); color:var(--accent);}
  .cal-cell.st-wfh{background:var(--wfh-soft); color:var(--wfh);}
  .cal-cell.st-weekend{color:var(--ink-faint);}
  .cal-cell.st-untracked{color:var(--ink-faint); opacity:.7;}
  .cal-cell.st-unmarked-past{
    background-color:var(--critical-soft);
    background-image:repeating-linear-gradient(45deg,
      transparent, transparent 5px,
      color-mix(in srgb, var(--critical) 24%, transparent) 5px,
      color-mix(in srgb, var(--critical) 24%, transparent) 10px);
    color:var(--critical);
  }
  .cal-cell.st-future{color:var(--ink-faint);}
  /* Plan mode: a forecast day, not a real entry — same status color as text/
     border, but hollow (dashed outline, neutral fill) so it never reads as
     an actual logged day at a glance. */
  .cal-cell.is-planned{
    background:var(--surface-2);
    border-style:dashed; border-width:1.5px; border-color:currentColor;
  }

  .plan-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--border);
  }
  .plan-toggle-label{font-weight:600; font-size:13.5px;}
  .switch{position:relative; display:inline-block; width:42px; height:25px; flex:none; cursor:pointer;}
  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
  .switch-track{
    position:absolute; inset:0; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:99px; transition:background .15s, border-color .15s;
  }
  .switch-track::after{
    content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:99px;
    background:var(--ink-faint); transition:transform .15s, background .15s;
  }
  .switch input:checked ~ .switch-track{background:var(--accent-soft); border-color:var(--accent);}
  .switch input:checked ~ .switch-track::after{transform:translateX(17px); background:var(--accent);}
  .switch input:disabled ~ .switch-track{opacity:.45; cursor:not-allowed;}
  .switch input:disabled{cursor:not-allowed;}

  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:2px;}
  .legend-item{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft);}
  .legend-swatch{width:9px; height:9px; border-radius:3px;}

  .summary-table{width:100%; border-collapse:collapse; font-size:13px;}
  .summary-table th{
    text-align:left; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;
    font-weight:600; padding:0 6px 6px; border-bottom:1px solid var(--border);
  }
  .summary-table td{padding:8px 6px; border-bottom:1px solid var(--border);}
  .summary-table tr:last-child td{border-bottom:none;}
  .summary-table td.num, .summary-table th.num{text-align:right; font-family:"IBM Plex Mono",monospace;}
  .table-scroll{overflow-x:auto;}

  .kv-list{display:flex; flex-direction:column; gap:0;}
  .kv-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .v{font-family:"IBM Plex Mono", monospace; font-weight:600;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .field input, .field select, .field textarea{
    font:inherit; font-size:15px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); width:100%;
  }
  .field textarea{resize:vertical; min-height:64px; line-height:1.4;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent); outline:none;}
  .field-hint{font-size:11.5px; color:var(--ink-faint);}

  .list-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item-main{min-width:0;}
  .list-item-date{font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-faint);}
  .list-item-name{font-size:14.5px; font-weight:500; margin-top:1px;}
  .icon-btn{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:6px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{color:var(--critical);}
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn-edit:hover{color:var(--accent);}

  .empty-state{text-align:center; padding:26px 10px; color:var(--ink-faint);}
  .empty-state svg{width:34px; height:34px; margin-bottom:8px; opacity:.6;}
  .empty-state p{font-size:13.5px; margin:4px 0 0;}

  .divider{height:1px; background:var(--border); border:none; margin:2px 0;}

  form{display:flex; flex-direction:column; gap:12px;}

  /* Bottom nav — floating glass pill */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0;
    z-index:30;
    display:flex; justify-content:center;
    padding:0 14px;
    pointer-events:none;
  }
  .bottomnav-inner{
    display:flex; width:100%; max-width:520px; gap:2px;
    pointer-events:auto;
    background:color-mix(in srgb, var(--surface) 70%, transparent);
    backdrop-filter:blur(22px) saturate(1.7);
    -webkit-backdrop-filter:blur(22px) saturate(1.7);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 12px 32px -10px rgba(4,14,30,0.32), 0 2px 10px -2px rgba(4,14,30,0.14);
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; border-radius:16px; padding:9px 4px 8px; color:var(--ink-faint); cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .navbtn svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .navbtn span{font-size:10px; font-weight:600;}
  .navbtn.active{color:var(--accent); background:color-mix(in srgb, var(--accent-soft) 80%, transparent);}

  /* Sheet / modal */
  .overlay{
    position:fixed; inset:0; background:rgba(15,20,19,0.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .overlay.center{align-items:center; padding:20px;}
  .sheet{
    background:var(--surface); width:100%; max-width:560px; border-radius:20px 20px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .22s cubic-bezier(.2,.8,.3,1);
    max-height:86vh; overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,0.18);
  }
  .overlay.open .sheet{transform:translateY(0);}
  .overlay.center .sheet{
    border-radius:18px; transform:translateY(10px) scale(.98); max-height:80vh;
  }
  .overlay.center.open .sheet{transform:none;}
  .sheet-grabber{width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 14px;}
  .sheet-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; gap:10px;}
  .sheet-close{background:var(--surface-2); border:none; border-radius:99px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); flex:none;}
  .sheet-close svg{width:15px; height:15px;}

  /* Hidden backfill sheet — hold-out testing tool, not part of normal use */
  .bf-note{background:var(--warn-soft); color:var(--ink); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.5;}
  .bf-row{border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px;}
  .bf-row-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .bf-month{font-weight:700; font-size:13.5px;}
  .bf-toggle{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .bf-toggle input{width:15px; height:15px;}
  .bf-fields{display:flex; gap:8px; margin-top:10px;}
  .bf-fields .field{flex:1; margin:0;}
  .bf-fields input:disabled{opacity:.45;}
  .bf-pct{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

  /* About page — developer / help sections */
  .about-person{display:flex; align-items:center; gap:12px; margin-top:10px;}
  .about-avatar{
    width:44px; height:44px; border-radius:99px; flex:none;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces", serif; font-weight:600; font-size:17px;
  }
  .about-person-name{font-weight:700; font-size:14.5px;}
  .about-person-role{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .about-link-row{display:flex; gap:8px; margin-top:12px;}
  .about-link{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 10px; font-size:12.5px; font-weight:600; color:var(--ink); text-decoration:none;
  }
  .about-link svg{width:14px; height:14px; flex:none;}

  /* Guided tour / coach marks */
  .tour-block{position:fixed; inset:0; z-index:199; background:transparent;}
  .tour-spot{
    position:fixed; z-index:200; pointer-events:none;
    border-radius:16px; border:2px solid var(--accent);
    box-shadow:0 0 0 9999px rgba(6,14,28,0.72);
    transition:top .22s ease, left .22s ease, width .22s ease, height .22s ease, opacity .15s ease;
  }
  .tour-card{
    position:fixed; z-index:201; width:calc(100% - 32px); max-width:320px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:0 16px 40px -12px rgba(4,14,30,0.45);
    transition:top .22s ease, left .22s ease, bottom .22s ease, opacity .15s ease;
  }
  .tour-step{font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em;}
  .tour-card h3{font-size:15.5px; margin:4px 0 6px; font-family:"Fraunces", serif;}
  .tour-card p{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .tour-actions{display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:10px;}
  .tour-skip{background:none; border:none; color:var(--ink-faint); font-size:12.5px; font-weight:600; cursor:pointer; padding:8px 2px;}
  .tour-nextgroup{display:flex; align-items:center; gap:10px;}
  .tour-dots{display:flex; gap:4px;}
  .tour-dot{width:5px; height:5px; border-radius:99px; background:var(--border);}
  .tour-dot.on{background:var(--accent); width:12px; border-radius:4px;}
  .tour-btn{border:none; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer;}
  .tour-btn-back{background:var(--surface-2); color:var(--ink);}
  .tour-btn-next{background:var(--accent); color:var(--accent-ink);}

  .option-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .option-btn{
    display:flex; align-items:center; gap:9px; padding:13px 12px; border-radius:12px;
    border:1.5px solid var(--border); background:var(--surface); cursor:pointer; text-align:left;
    font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .option-btn .dot{width:9px; height:9px; border-radius:99px; flex:none;}
  .option-btn.full{grid-column:1 / -1;}
  .option-btn.selected{border-color:var(--accent); background:var(--accent-soft);}

  .subtype-row{display:flex; gap:8px; margin-top:2px;}
  .subtype-chip{
    flex:1; padding:8px 6px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface);
    font-size:12.5px; font-weight:600; cursor:pointer; text-align:center; color:var(--ink-soft);
  }
  .subtype-chip.selected{border-color:var(--warn); color:var(--warn); background:var(--warn-soft);}

  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:10px 16px;
    border-radius:99px; z-index:60; opacity:0; pointer-events:none; transition:all .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .onboard{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .onboard-inner{max-width:440px; margin:0 auto; padding:calc(40px + env(safe-area-inset-top)) 22px 40px; width:100%; flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px;}
  .onboard-mark{width:52px; height:52px; color:var(--accent);}
  .onboard-mark rect{fill:none; stroke:currentColor; stroke-width:1.5;}
  .onboard-mark line{stroke:currentColor; stroke-width:1.5;}
  .onboard-mark polyline{fill:none; stroke:var(--warm); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  /* Multi-step first-launch onboarding */
  .ob-topbar{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .ob-dots{display:flex; gap:6px;}
  .ob-dot{width:6px; height:6px; border-radius:99px; background:var(--border); transition:all .2s ease;}
  .ob-dot.on{background:var(--accent); width:20px; border-radius:4px;}
  .ob-skip{background:none; border:none; color:var(--ink-faint); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 2px;}
  .ob-slide{display:flex; flex-direction:column; gap:22px; animation:fade-in .22s ease;}
  .ob-feature-list{display:flex; flex-direction:column; gap:14px;}
  .ob-feature{display:flex; align-items:flex-start; gap:12px;}
  .ob-feature-dot{width:10px; height:10px; border-radius:99px; margin-top:5px; flex:none;}
  .ob-feature-title{font-weight:700; font-size:14.5px;}
  .ob-feature-text{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .ob-nav{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .ob-nav .btn{flex:1;}

  .formula-box{
    background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; color:var(--ink-soft);
    font-family:"IBM Plex Mono", monospace;
  }

  .hidden{display:none !important;}

  @media (min-width:640px){
    body{background:var(--surface-2);}
    #app{background:var(--bg); box-shadow:var(--shadow); min-height:100dvh;}
  }

  /* Tablets, foldables unfolded, and desktop preview: trade the phone-frame look
     for a side navigation rail (the standard phone-to-tablet adaptation) and a
     wider reading column, rather than just stretching the phone layout. */
  @media (min-width:900px){
    body{background:var(--bg);}
    #app{
      max-width:none; box-shadow:none; min-height:100vh;
      padding-left:96px; padding-bottom:32px;
    }
    main{max-width:760px; margin:0 auto; width:100%; padding:26px 24px 8px; gap:16px;}
    .topbar{padding-left:24px; padding-right:24px;}
    .bottomnav{
      top:0; bottom:0; left:0; right:auto; width:96px;
      align-items:stretch; justify-content:flex-start;
      padding:0; pointer-events:auto;
    }
    .bottomnav-inner{
      flex-direction:column; max-width:none; width:100%; gap:6px;
      border-radius:0; border:none; border-right:1px solid var(--border);
      background:color-mix(in srgb, var(--surface) 90%, transparent);
      box-shadow:none;
      padding:calc(22px + env(safe-area-inset-top)) 6px 6px;
    }
    .navbtn{padding:15px 4px;}
    .navbtn svg{width:23px; height:23px;}
    .navbtn span{font-size:10.5px;}
    .ring-wrap{width:172px; height:172px;}
    .cal-cell{font-size:14.5px;}
    .stat-chip .n{font-size:17px;}
  }

  /* GPS celebration: a full-screen "stamped" reveal — see showGpsCelebration().
     White text on a fixed dark scrim regardless of theme, so it stays legible
     over either the light or dark app background without extra branching. */
  .gps-celebration-overlay{
    position:fixed; inset:0; z-index:500;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); pointer-events:none;
    opacity:0; transition:opacity .35s ease, background-color .35s ease;
  }
  .gps-celebration-overlay.show{
    pointer-events:auto; opacity:1;
    background:rgba(6,30,20,.88);
  }
  .gps-celebration-canvas{position:absolute; inset:0; width:100%; height:100%;}
  .gps-celebration-content{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:16px;
    transform:translateY(8px); opacity:0;
    transition:opacity .3s ease .05s, transform .3s ease .05s;
    padding:0 30px; text-align:center;
  }
  .gps-celebration-overlay.show .gps-celebration-content{opacity:1; transform:translateY(0);}
  .gps-stamp{
    position:relative; width:118px; height:118px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:var(--good);
    transform:scale(2.3) rotate(-14deg); opacity:0;
  }
  .gps-celebration-overlay.show .gps-stamp{ animation:gpsStampLand .62s cubic-bezier(.17,1.4,.4,1) forwards; }
  @keyframes gpsStampLand{
    0%{ transform:scale(2.3) rotate(-14deg); opacity:0; }
    55%{ transform:scale(.92) rotate(-6deg); opacity:1; }
    75%{ transform:scale(1.06) rotate(-9deg); }
    100%{ transform:scale(1) rotate(-8deg); opacity:1; }
  }
  .gps-stamp-ring{position:absolute; inset:0; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:4;}
  .gps-stamp-ring circle{stroke-dasharray:340; stroke-dashoffset:340;}
  .gps-celebration-overlay.show .gps-stamp-ring circle{ animation:gpsRingDraw .5s ease-out .1s forwards; }
  @keyframes gpsRingDraw{ to{ stroke-dashoffset:0; } }
  .gps-stamp-check{width:44px; height:44px; opacity:0; transform:scale(.5);}
  .gps-celebration-overlay.show .gps-stamp-check{ animation:gpsCheckPop .4s cubic-bezier(.2,1.6,.4,1) .32s forwards; }
  @keyframes gpsCheckPop{ to{ opacity:1; transform:scale(1); } }
  .gps-celebration-title{font-family:"Fraunces", serif; font-weight:600; font-size:22px; color:#fff;}
  .gps-celebration-sub{font-family:"IBM Plex Mono", monospace; font-size:12px; color:rgba(255,255,255,.74); margin-top:2px;}
  @media (prefers-reduced-motion: reduce){
    .gps-stamp, .gps-stamp-ring circle, .gps-stamp-check{ animation:none !important; transform:none !important; opacity:1 !important; stroke-dashoffset:0 !important; }
    .gps-celebration-content{ transition:opacity .2s ease; }
  }

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var STORAGE_KEY = "officeLedger.v1";
var APP_VERSION = "1.5.4"; // keep in sync with package.json's "version"
var UPDATE_REPO = "debarun1234/anz-attendance-tracker-app"; // GitHub owner/repo checked for releases
var DOW_LABELS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var STATUS_META = {
  present:        {label:"Present (Office)", color:"var(--good)"},
  workedWeekend:  {label:"Worked Weekend",    color:"var(--good)"},
  leave:          {label:"Leave",             color:"var(--warn)"},
  holiday:        {label:"Public Holiday",    color:"var(--holiday)"},
  compoff:        {label:"Comp Off Taken",    color:"var(--accent)"},
  wfh:            {label:"Work From Home",    color:"var(--wfh)"},
  weekend:        {label:"Weekend",           color:"var(--ink-faint)"},
  unmarkedPast:   {label:"Unmarked",          color:"var(--critical)"},
  future:         {label:"Upcoming",          color:"var(--ink-faint)"}
};
var LEAVE_TYPES = [{k:"annual",l:"Annual"},{k:"sick",l:"Sick"},{k:"carer",l:"Carer"}];

/* ---------- date helpers (local time, no UTC drift) ---------- */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function iso(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
function isoOf(date){ return iso(date.getFullYear(), date.getMonth(), date.getDate()); }
function parseIso(s){ var p=s.split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function today(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayStr(){ return isoOf(today()); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function mondayIndex(date){ return (date.getDay()+6)%7; } // 0=Mon..6=Sun
function isWeekend(date){ var d=date.getDay(); return d===0 || d===6; }
var MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTH_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtLong(dateOrStr){
  var d = typeof dateOrStr==="string" ? parseIso(dateOrStr) : dateOrStr;
  return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][mondayIndex(d)]+", "+d.getDate()+" "+MONTH_SHORT[d.getMonth()]+" "+d.getFullYear();
}
function fmtShort(dateOrStr){
  var d = typeof dateOrStr==="string" ? parseIso(dateOrStr) : dateOrStr;
  return d.getDate()+" "+MONTH_SHORT[d.getMonth()]+" "+d.getFullYear();
}

/* ---------- FY helpers (Oct -> Sep) ---------- */
var FY_START_MONTH = 9; // October, 0-indexed
function fyOf(date){
  var y=date.getFullYear(), m=date.getMonth();
  var startYear = m>=FY_START_MONTH ? y : y-1;
  return {
    startYear:startYear,
    start:new Date(startYear, FY_START_MONTH, 1),
    end:new Date(startYear+1, FY_START_MONTH-1, daysInMonth(startYear+1, FY_START_MONTH-1)),
    label:"FY "+startYear+"–"+String(startYear+1).slice(2)
  };
}
function fyMonths(fy){
  var out=[];
  for(var i=0;i<12;i++){
    var m = (FY_START_MONTH+i)%12;
    var y = fy.startYear + (FY_START_MONTH+i>=12 ? 1 : 0);
    out.push({year:y, month:m});
  }
  return out;
}

/* ---------- state ---------- */
var state = null;
function defaultState(){
  return {
    profile:{ name:"", targetPct:50, openingCompOff:0, openingAnnualLeave:null, openingCarerSickLeave:null, createdAt: todayStr(), tourSeen:{} },
    days:{},          // "YYYY-MM-DD" -> {status, leaveType}
    holidays:[],       // {id, date, name}
    plan:{},            // "YYYY-MM-DD" -> {status, leaveType} — Plan mode entries. Same
                         // shape as `days`, but kept fully separate: a plan is a forecast,
                         // never counted in real attendance, only in the "Projected" figure.
    planMonths:{},       // "YYYY-MM" -> true — months where Plan mode is switched on. Turning
                         // a month off clears every plan entry inside it (see clearPlanForMonth).
    officeLocations:[     // {id, name, address, lat, lng, radiusM} — places auto-detection
                         // will match against. Pre-seeded with the two Bangalore offices;
                         // fully editable, and a fresh "Take my current location" capture
                         // replaces the seeded coordinates with an on-site-accurate reading.
      { id:"loc-acacia", name:"Acacia Office", address:"Acacia Parcel 1, Embassy Manyata Business Park, Outer Ring Road, Rachenahalli Village, K.R. Puram Hobli, Nagavara, Bengaluru - 560045, Karnataka", lat:13.048355, lng:77.620706, radiusM:350 },
      { id:"loc-hibiscus", name:"Hibiscus Office", address:"2B Tower 1 (Hibiscus), Embassy Tech Village, 6th & 7th Floor, Devarabeesanahalli Village, Varthur Hobli, Bengaluru East Taluk, Bengaluru - 560103, Karnataka", lat:12.926596, lng:77.693002, radiusM:350 }
    ],
    locationSettings:{ enabled:false, confirmedDates:{}, dismissedDates:{}, confirmedOffice:{}, celebrationShownDates:{} },
                         // confirmedDates/dismissedDates: "YYYY-MM-DD" -> true, per-day dedupe
                         // so a match is only ever offered once, whichever way it's resolved.
                         // confirmedOffice: "YYYY-MM-DD" -> office name, so a later celebration
                         // reveal can still say which office matched. celebrationShownDates:
                         // "YYYY-MM-DD" -> true, so the GPS celebration animation plays once per
                         // day regardless of how many times the app is opened or resumed.
    wfhReminders:{ enabled:false, startTime:"09:15", endTime:"17:45" },
    // Two separate pools, matching how the company actually runs leave:
    // Annual leave accrues and is tracked on its own; Sick and Carer leave
    // share one combined pool, distinct from Annual.
    annualLeave:{ current:null, lastUpdated:null, history:[] },
    carerSickLeave:{ current:null, lastUpdated:null, history:[] },
    dismissed:{},       // banner dismissal keys
    notified:{},        // native-notification dedupe keys (one push per reminder period)
    monthOverrides:{},  // "YYYY-MM" -> {eligible, attended} — manual backfill for months
                         // tracked before day-by-day logging started. Hidden testing tool,
                         // not part of normal use — see openBackfillSheet().
    fyTotalOverride:null, // number|null — forces the FY-to-date percentage shown on Calendar
                         // to this exact figure, for matching an officially reported total
                         // that doesn't reconcile with the per-month backfill's day-count math.
    notifications:[],    // {id, type:'error'|'update'|'bug', title, message, ts, read} — newest first
    lastUpdateCheck:0,    // ms timestamp of the last silent update check (throttles the GitHub call)
    lastNotifiedVersion:null, // last release tag we already raised an "update available" notification for
    lastSeenVersion:null  // APP_VERSION as of the last run — lets init() notice "this is a fresh
                         // version since I last opened" and confirm the update actually landed,
                         // instead of leaving the PWA's background switch-over to fail silently.
                         // null means either a brand-new install or a pre-1.5.4 save that never
                         // recorded one — either way, no confirmation toast on that first run.
  };
}
/* Storage: on the native app this writes through Capacitor's Preferences plugin,
   which is backed by Android SharedPreferences / iOS UserDefaults — real device
   storage, independent of the WebView's own site data. In a plain browser (or the
   web preview) it falls back to localStorage. Either way the record lives only on
   this device; there is no server. */
function nativeStorageReady(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences);
}
async function storageGet(key){
  try{
    if(nativeStorageReady()){
      var res = await window.Capacitor.Plugins.Preferences.get({key:key});
      return (res && res.value != null) ? res.value : null;
    }
  }catch(e){ console.warn("Office Ledger: native storage read failed, falling back", e); }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(nativeStorageReady()){
      await window.Capacitor.Plugins.Preferences.set({key:key, value:value});
      return;
    }
  }catch(e){ console.warn("Office Ledger: native storage write failed, falling back", e); }
  localStorage.setItem(key, value);
}
async function storageRemove(key){
  try{
    if(nativeStorageReady()){
      await window.Capacitor.Plugins.Preferences.remove({key:key});
    }
  }catch(e){ console.warn(e); }
  try{ localStorage.removeItem(key); }catch(e){}
}

async function loadState(){
  try{
    var raw = await storageGet(STORAGE_KEY);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed!=="object" || !parsed.profile) return null;
    var d = defaultState();
    var merged = Object.assign(d, parsed, {
      profile: Object.assign(d.profile, parsed.profile),
      annualLeave: Object.assign(d.annualLeave, parsed.annualLeave),
      carerSickLeave: Object.assign(d.carerSickLeave, parsed.carerSickLeave),
      days: parsed.days || {},
      holidays: parsed.holidays || [],
      plan: parsed.plan || {},
      planMonths: parsed.planMonths || {},
      officeLocations: parsed.officeLocations || defaultState().officeLocations,
      locationSettings: Object.assign(d.locationSettings, parsed.locationSettings, {
        confirmedDates: (parsed.locationSettings && parsed.locationSettings.confirmedDates) || {},
        dismissedDates: (parsed.locationSettings && parsed.locationSettings.dismissedDates) || {},
        confirmedOffice: (parsed.locationSettings && parsed.locationSettings.confirmedOffice) || {},
        celebrationShownDates: (parsed.locationSettings && parsed.locationSettings.celebrationShownDates) || {}
      }),
      wfhReminders: Object.assign(d.wfhReminders, parsed.wfhReminders),
      dismissed: parsed.dismissed || {},
      notified: parsed.notified || {},
      monthOverrides: parsed.monthOverrides || {},
      notifications: parsed.notifications || []
    });
    // One-time migration: older backups stored a single shared leaveBalance
    // pool. Carry that figure into Annual leave so nothing is lost, and
    // leave Sick/Carer to be reported fresh under the new split.
    if(parsed.leaveBalance && !parsed.annualLeave){
      merged.annualLeave = Object.assign({current:null,lastUpdated:null,history:[]}, parsed.leaveBalance);
    }
    return merged;
  }catch(e){ console.warn("Office Ledger: could not read saved data", e); return null; }
}
async function saveState(){
  try{ await storageSet(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("Office Ledger: could not save data", e); showToast("Couldn't save — device storage may be full"); }
}

/* ---------- notification center ----------
   A lightweight in-app inbox: app errors, "update available" pings, and a
   record of bug reports you've sent — accessed via the bell icon in the
   top bar. Stored on state so it survives restarts; capped so it can't
   grow forever. */
function addNotification(type, title, message){
  if(!state) return; // nothing to log into before onboarding finishes
  state.notifications = state.notifications || [];
  state.notifications.unshift({
    id:"n"+Date.now()+Math.random().toString(36).slice(2,7),
    type:type, title:title, message:message||"", ts:Date.now(), read:false
  });
  if(state.notifications.length > 100) state.notifications.length = 100;
  saveState();
  updateNotifBadge();
}
function unreadNotifCount(){
  return ((state && state.notifications) || []).filter(function(n){ return !n.read; }).length;
}
function updateNotifBadge(){
  var badge = document.getElementById("notifBadge");
  if(!badge) return;
  var n = unreadNotifCount();
  if(n>0){ badge.textContent = n>99 ? "99+" : String(n); badge.classList.remove("hidden"); }
  else { badge.classList.add("hidden"); }
}
function notifIcon(type){
  if(type==="error") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"></circle><line x1="12" y1="7.5" x2="12" y2="13"></line><line x1="12" y1="16.7" x2="12" y2="16.8"></line></svg>';
  if(type==="update") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M5 19h14"></path></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="10" rx="3"></rect><path d="M9 8V6a3 3 0 0 1 6 0v2"></path><line x1="3.5" y1="12" x2="7" y2="12"></line><line x1="17" y1="12" x2="20.5" y2="12"></line><line x1="9" y1="18.5" x2="7" y2="21"></line><line x1="15" y1="18.5" x2="17" y2="21"></line></svg>';
}
function timeAgo(ts){
  var s = Math.max(0, Math.floor((Date.now()-ts)/1000));
  if(s<60) return "just now";
  var m = Math.floor(s/60); if(m<60) return m+"m ago";
  var h = Math.floor(m/60); if(h<24) return h+"h ago";
  var d = Math.floor(h/24); if(d<7) return d+"d ago";
  return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function openNotifCenter(){
  var list = ((state && state.notifications) || []);
  var rows = list.map(function(n){
    return '<div class="notif-item'+(n.read?"":" unread")+'" data-id="'+n.id+'">'+
      '<div class="notif-icon t-'+n.type+'">'+notifIcon(n.type)+'</div>'+
      '<div class="notif-body"><div class="notif-title">'+esc(n.title)+'</div>'+
      (n.message ? '<div class="notif-msg">'+esc(n.message)+'</div>' : '')+
      '<div class="notif-time">'+timeAgo(n.ts)+'</div></div>'+
    '</div>';
  }).join("");
  var html =
    '<div class="sheet-grabber"></div>'+
    '<div class="sheet-header">'+
      '<div><div class="eyebrow">Inbox</div><h2 style="font-size:19px;">Notifications</h2></div>'+
      '<button class="sheet-close" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>'+
    '</div>'+
    (list.length ? '<button class="btn btn-secondary btn-block" id="clearNotifsBtn" style="margin-top:4px;">Clear all</button>' : '')+
    '<div style="margin-top:6px;">'+
    (rows || '<div class="notif-empty">Nothing here yet — errors, update alerts and bug reports you send will show up in this list.</div>')+
    '</div>';
  document.getElementById("sheetContent").innerHTML = html;
  var overlay = document.getElementById("sheetOverlay");
  overlay.classList.add("center");
  overlay.classList.add("open");
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  overlay.onclick = function(e){ if(e.target===overlay) closeSheet(); };
  var clearBtn = document.getElementById("clearNotifsBtn");
  if(clearBtn) clearBtn.addEventListener("click", function(){
    state.notifications = [];
    saveState();
    updateNotifBadge();
    closeSheet();
    showToast("Notifications cleared");
  });
  // Opening the inbox marks everything read.
  var changed = false;
  list.forEach(function(n){ if(!n.read){ n.read = true; changed = true; } });
  if(changed){ saveState(); updateNotifBadge(); }
}
// Catch runtime errors app-wide and log them into the notification center,
// so "something broke" is visible in-app instead of only in a console
// nobody on a phone can see.
window.addEventListener("error", function(e){
  try{ addNotification("error", "Something went wrong", (e && e.message) ? String(e.message) : "An unexpected error occurred."); }
  catch(_e){}
});
window.addEventListener("unhandledrejection", function(e){
  try{
    var reason = e && e.reason;
    var msg = (reason && (reason.message || String(reason))) || "An unexpected error occurred.";
    addNotification("error", "Something went wrong", msg);
  }catch(_e){}
});

/* ---------- holiday lookup ---------- */
function holidayMap(){
  var m={};
  (state.holidays||[]).forEach(function(h){ m[h.date]=h.name; });
  return m;
}

/* ---------- classification ---------- */
function classifyDay(dateStr, hMap){
  var explicit = state.days[dateStr];
  if(explicit && explicit.status) return explicit.status;
  if(hMap[dateStr]) return "holiday";
  var d = parseIso(dateStr);
  if(isWeekend(d)) return "weekend";
  // Days before the profile existed aren't penalised unless explicitly backfilled above.
  if(dateStr < state.profile.createdAt) return "untracked";
  return "unmarked";
}

/* ---------- Plan mode ----------
   A separate, opt-in-per-month forecast layer. A planned day never becomes
   a real attendance record on its own — classifyDay() above never looks at
   state.plan — it only feeds classifyDayWithPlan() below, which is used
   exclusively to compute the "Projected" figure and to render planned
   (dashed) calendar cells. Logging the real day when it arrives, via the
   normal day sheet, is what actually counts. */
function planMonthKey(dateStr){ return dateStr.slice(0,7); }
function monthIsPlannable(y,m){
  var mr = monthRangeStr(y,m);
  return mr.end >= todayStr(); // not fully in the past
}
function isPlanModeOn(monthKey){ return !!(state.planMonths && state.planMonths[monthKey]); }
function planCountForMonth(monthKey){
  return Object.keys(state.plan||{}).filter(function(ds){ return planMonthKey(ds)===monthKey; }).length;
}
function clearPlanForMonth(monthKey){
  Object.keys(state.plan||{}).forEach(function(ds){ if(planMonthKey(ds)===monthKey) delete state.plan[ds]; });
}
/* Same as classifyDay, but a future day with no real entry and no holiday
   falls back to whatever was planned for it, instead of "unmarked". Used
   only for the Projected figure and for painting planned calendar cells —
   never for real attendance math. */
function classifyDayWithPlan(dateStr, hMap){
  if(state.days[dateStr] && state.days[dateStr].status) return classifyDay(dateStr, hMap);
  if(hMap[dateStr]) return "holiday";
  var planned = state.plan[dateStr];
  if(planned && planned.status) return planned.status;
  return classifyDay(dateStr, hMap);
}

/* range stats: iterates [startStr, endStr] inclusive, split around cutoffStr (usually today).
   "Resolved" days (<= cutoff) are the true to-date figures: an unmarked resolved weekday
   counts as eligible but NOT attended (a logging gap that counts against you).
   "Full" figures additionally fold in days after the cutoff, treating an unmarked future
   weekday as still-eligible-but-not-yet-attended — useful for "what do I need by month end"
   projections without inflating a to-date percentage with days that haven't happened. */
/* Self-reported leave balances feed the eligible-day math too, not just
   the Leave tab display. When a pool's reported balance drops between two
   consecutive monthly updates, that drop is "leave taken" for the month
   the newer entry is dated in. Any of that month's days already marked
   "Leave" on the Calendar are subtracted first (an explicit mark always
   wins and is never double-counted) — only the remaining, unmarked shortfall
   is inferred and excluded from eligible working days for that month. */
function monthStartStr(monthKey){ return monthKey+"-01"; }
function monthEndStr(monthKey){
  var y=parseInt(monthKey.slice(0,4),10), m=parseInt(monthKey.slice(5,7),10)-1;
  return iso(y,m,daysInMonth(y,m));
}
function inferredLeaveByMonth(){
  var out = {};
  function scan(pool, matchTypes, openingValue){
    var hist = (pool.history||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
    // With a reported opening balance (set in Settings, like opening comp off),
    // treat it as the baseline reading as of when tracking started — so even
    // the very first monthly update produces a usable delta, instead of
    // needing a second update before inference can kick in.
    if(openingValue!==null && openingValue!==undefined && hist.length>0 && hist[0].date>state.profile.createdAt){
      hist.unshift({date:state.profile.createdAt, value:openingValue});
    }
    for(var i=1;i<hist.length;i++){
      var prev=hist[i-1], cur=hist[i];
      var delta = prev.value - cur.value; // balance dropped => leave was taken
      if(delta<=0) continue;
      var monthKey = cur.date.slice(0,7);
      var explicitCount = Object.keys(state.days).filter(function(ds){
        if(ds.slice(0,7)!==monthKey) return false;
        var day = state.days[ds];
        return day.status==="leave" && matchTypes.indexOf(day.leaveType)!==-1;
      }).length;
      var inferred = Math.max(0, delta - explicitCount);
      if(inferred>0) out[monthKey] = (out[monthKey]||0) + inferred;
    }
  }
  scan(state.annualLeave, ["annual"], state.profile.openingAnnualLeave);
  scan(state.carerSickLeave, ["sick","carer"], state.profile.openingCarerSickLeave);
  return out;
}

function rangeStats(startStr, endStr, cutoffStr, classifier){
  classifier = classifier || classifyDay;
  var hMap = holidayMap();
  var start = parseIso(startStr), end = parseIso(endStr);
  var eligibleResolved=0, eligibleFull=0, attendedResolved=0, attendedFull=0, leaveN=0, holidayN=0, compoffN=0,
      weekendWorkedN=0, unmarkedResolvedN=0, unmarkedFutureN=0, wfhN=0;
  var cur = new Date(start.getTime());
  while(cur.getTime() <= end.getTime()){
    var ds = isoOf(cur);
    var cls = classifier(ds, hMap);
    var isResolved = ds <= cutoffStr;
    if(cls==="present" || cls==="workedWeekend"){
      eligibleFull++; attendedFull++;
      if(cls==="workedWeekend") weekendWorkedN++;
      if(isResolved){ eligibleResolved++; attendedResolved++; }
    }
    else if(cls==="leave"){ leaveN++; }
    else if(cls==="holiday"){ holidayN++; }
    else if(cls==="compoff"){ compoffN++; }
    else if(cls==="wfh"){
      // Still a real working day (unlike leave/holiday), so it stays in the
      // eligible denominator — it just never counts as attended, since the
      // target is specifically about being physically in the office. Not
      // flagged as a logging gap either, since it's a deliberate status.
      wfhN++;
      eligibleFull++;
      if(isResolved) eligibleResolved++;
    }
    else if(cls==="weekend" || cls==="untracked"){ /* excluded */ }
    else if(cls==="unmarked"){
      eligibleFull++;
      if(isResolved){ eligibleResolved++; unmarkedResolvedN++; }
      else { unmarkedFutureN++; }
    }
    cur.setDate(cur.getDate()+1);
  }
  // Fold in leave inferred from reported balance drops, for any calendar
  // month fully contained within [startStr, endStr] (every caller in this
  // app queries either one whole month or the whole FY, so this always
  // lands on clean month boundaries).
  var inferredMap = inferredLeaveByMonth();
  Object.keys(inferredMap).forEach(function(monthKey){
    var mStart = monthStartStr(monthKey), mEnd = monthEndStr(monthKey);
    if(mStart<startStr || mEnd>endStr) return;
    var n = inferredMap[monthKey];
    leaveN += n;
    eligibleFull = Math.max(0, eligibleFull-n);
    if(mEnd<=cutoffStr){
      eligibleResolved = Math.max(0, eligibleResolved-n);
      unmarkedResolvedN = Math.max(0, unmarkedResolvedN-n);
    } else if(mStart<=cutoffStr){
      var forgive = Math.min(n, unmarkedResolvedN);
      eligibleResolved = Math.max(0, eligibleResolved-forgive);
      unmarkedResolvedN = Math.max(0, unmarkedResolvedN-forgive);
    }
  });
  return {
    eligibleResolved:eligibleResolved, eligibleFull:eligibleFull,
    attended:attendedResolved, attendedFull:attendedFull,
    leave:leaveN, holiday:holidayN, compoff:compoffN, wfh:wfhN, weekendWorked:weekendWorkedN,
    unmarkedPast:unmarkedResolvedN, pending:unmarkedFutureN,
    pctResolved: eligibleResolved>0 ? (attendedResolved/eligibleResolved*100) : null,
    pctFull: eligibleFull>0 ? (attendedFull/eligibleFull*100) : null
  };
}

/* Manual month backfill (hidden testing tool — see openBackfillSheet()).
   A month with an override in state.monthOverrides reports that eligible/
   attended pair everywhere instead of what's computed from day-by-day
   marks, so months tracked before this app existed can still feed the FY
   aggregate. Every other field on the stats object is left as actually
   computed, and untouched months are unaffected. */
function monthOverrideKey(y,m){ return y+"-"+pad2(m+1); }
function monthStats(y, m, cutoffStr, classifier){
  var mr = monthRangeStr(y,m);
  var real = rangeStats(mr.start, mr.end, cutoffStr, classifier);
  var ov = state.monthOverrides && state.monthOverrides[monthOverrideKey(y,m)];
  if(!ov) return real;
  var eligible = Math.max(0, ov.eligible||0);
  var attended = Math.max(0, Math.min(eligible, ov.attended||0));
  return Object.assign({}, real, {
    eligibleResolved: eligible, eligibleFull: eligible,
    attended: attended, attendedFull: attended,
    pctResolved: eligible>0 ? (attended/eligible*100) : null,
    pctFull: eligible>0 ? (attended/eligible*100) : null,
    overridden: true
  });
}
/* FY-wide totals, summed month by month so each month can be individually
   overridden — mathematically identical to one continuous rangeStats() call
   over the whole FY when nothing is overridden, since day classification
   and leave inference are both already month-scoped internally. */
function fyAggregateStats(fy, classifier){
  var tStr = todayStr();
  var out = {eligibleResolved:0, eligibleFull:0, attended:0, attendedFull:0, pending:0};
  fyMonths(fy).forEach(function(mo){
    var s = monthStats(mo.year, mo.month, tStr, classifier);
    out.eligibleResolved += s.eligibleResolved;
    out.eligibleFull += s.eligibleFull;
    out.attended += s.attended;
    out.attendedFull += s.attendedFull;
    out.pending += s.pending;
  });
  out.pctResolved = out.eligibleResolved>0 ? (out.attended/out.eligibleResolved*100) : null;
  out.pctFull = out.eligibleFull>0 ? (out.attendedFull/out.eligibleFull*100) : null;
  // A per-month backfill's day-count math is only ever an approximation —
  // when the officially reported FY total doesn't reconcile with it, this
  // pins the shown percentage to that exact figure instead. Set from the
  // hidden backfill sheet (openBackfillSheet), same testing-only feature.
  if(typeof state.fyTotalOverride==="number" && !isNaN(state.fyTotalOverride)){
    out.pctResolved = state.fyTotalOverride;
    out.pctFull = state.fyTotalOverride;
    out.totalOverridden = true;
  }
  return out;
}

function monthRangeStr(y,m){
  return {start: iso(y,m,1), end: iso(y,m,daysInMonth(y,m))};
}

function compOffBalance(){
  var opening = state.profile.openingCompOff || 0;
  var worked=0, taken=0;
  Object.keys(state.days).forEach(function(ds){
    var st = state.days[ds].status;
    if(st==="workedWeekend") worked++;
    else if(st==="compoff") taken++;
  });
  return {balance: opening + worked - taken, opening:opening, worked:worked, taken:taken};
}

/* ---------- rendering helpers ---------- */
function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function pctColorClass(pct, target){
  if(pct===null) return "";
  if(pct>=target) return "status-good";
  if(pct>=target-15) return "status-warn";
  return "status-critical";
}
function fmtPct(pct){ return pct===null ? "—" : Math.round(pct)+"%"; }
function plural(n,label){ return n+" "+label+(n===1?"":"s"); }

function ringSvg(pct, target, size){
  size = size||150;
  var stroke=12, r=(size-stroke)/2, c=2*Math.PI*r;
  var p = pct===null?0:Math.max(0,Math.min(100,pct));
  var offset = c - (p/100)*c;
  var targetAngle = (target/100)*360;
  var tx = size/2 + r*Math.cos((targetAngle-90)*Math.PI/180);
  var ty = size/2 + r*Math.sin((targetAngle-90)*Math.PI/180);
  var color = pct===null ? "var(--ink-faint)" : (pct>=target?"var(--good)":(pct>=target-15?"var(--warn)":"var(--critical)"));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" style="transition:stroke-dashoffset .5s ease"/>'+
    '<circle cx="'+tx+'" cy="'+ty+'" r="3.4" fill="var(--surface)" stroke="var(--ink-faint)" stroke-width="1.5" transform="rotate(90 '+size/2+' '+size/2+')"/>'+
    '</svg>';
}

var tour = { active:false, view:null, idx:0, steps:[] };

function maybeAutoTour(v){
  if(!state || !state.profile) return;
  if(!state.profile.tourSeen) state.profile.tourSeen = {};
  if(state.profile.tourSeen[v]) return;
  setTimeout(function(){ startTour(v); }, 380);
}
function startTour(viewKey){
  var steps = (TOUR_STEPS[viewKey]||[]).filter(function(s){ return !!document.querySelector(s.sel); });
  if(!steps.length) return;
  tour = { active:true, view:viewKey, idx:0, steps:steps };
  if(!state.profile.tourSeen) state.profile.tourSeen = {};
  state.profile.tourSeen[viewKey] = true;
  saveState();
  buildTourDom();
  showTourStep();
  window.addEventListener("resize", onTourResize);
}
function buildTourDom(){
  if(!document.getElementById("tourBlock")){
    var block = document.createElement("div"); block.id="tourBlock"; block.className="tour-block";
    document.body.appendChild(block);
  }
  if(!document.getElementById("tourSpot")){
    var spot = document.createElement("div"); spot.id="tourSpot"; spot.className="tour-spot";
    document.body.appendChild(spot);
  }
  if(!document.getElementById("tourCard")){
    var card = document.createElement("div"); card.id="tourCard"; card.className="tour-card";
    document.body.appendChild(card);
  }
}
function onTourResize(){ if(tour.active) positionTourStep(); }
function showTourStep(){
  var step = tour.steps[tour.idx];
  var card = document.getElementById("tourCard");
  var dots = tour.steps.map(function(_,i){ return '<span class="tour-dot'+(i===tour.idx?' on':'')+'"></span>'; }).join("");
  card.innerHTML =
    '<div class="tour-step">Step '+(tour.idx+1)+' of '+tour.steps.length+'</div>'+
    '<h3>'+esc(step.title)+'</h3>'+
    '<p>'+esc(step.text)+'</p>'+
    '<div class="tour-actions">'+
      '<button class="tour-skip" id="tourSkip">Skip</button>'+
      '<div class="tour-nextgroup">'+
        '<div class="tour-dots">'+dots+'</div>'+
        (tour.idx>0 ? '<button class="tour-btn tour-btn-back" id="tourBack">Back</button>' : '')+
        '<button class="tour-btn tour-btn-next" id="tourNext">'+(tour.idx===tour.steps.length-1 ? "Got it" : "Next")+'</button>'+
      '</div>'+
    '</div>';
  document.getElementById("tourSkip").addEventListener("click", endTour);
  document.getElementById("tourNext").addEventListener("click", function(){
    if(tour.idx>=tour.steps.length-1) endTour();
    else { tour.idx++; showTourStep(); }
  });
  var backBtn = document.getElementById("tourBack");
  if(backBtn) backBtn.addEventListener("click", function(){ tour.idx--; showTourStep(); });
  positionTourStep();
}
function positionTourStep(){
  var step = tour.steps[tour.idx];
  var el = document.querySelector(step.sel);
  if(!el){ endTour(); return; }
  el.scrollIntoView({block:"center", behavior:"auto"});
  requestAnimationFrame(function(){ placeTourElements(el); });
}
function placeTourElements(el){
  var spot = document.getElementById("tourSpot");
  var card = document.getElementById("tourCard");
  if(!spot || !card) return;
  var pad = 8;
  var r = el.getBoundingClientRect();
  spot.style.top = (r.top-pad)+"px";
  spot.style.left = (r.left-pad)+"px";
  spot.style.width = (r.width+pad*2)+"px";
  spot.style.height = (r.height+pad*2)+"px";

  var cardH = card.offsetHeight || 170;
  var cardW = card.offsetWidth || 288;
  var spaceBelow = window.innerHeight - r.bottom;
  var spaceAbove = r.top;
  var top;
  if(spaceBelow > cardH+24) top = r.bottom+16;
  else if(spaceAbove > cardH+24) top = r.top-cardH-16;
  else top = Math.max(16, window.innerHeight-cardH-16);
  var left = Math.min(Math.max(16, r.left), Math.max(16, window.innerWidth-cardW-16));
  card.style.top = top+"px";
  card.style.left = left+"px";
}
function endTour(){
  tour.active = false;
  window.removeEventListener("resize", onTourResize);
  ["tourBlock","tourSpot","tourCard"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.remove();
  });
}
