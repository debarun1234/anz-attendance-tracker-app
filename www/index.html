}

/* ---------- native notifications (phone notification centre) ----------
   In-app banners above already surface these reminders inside the app.
   On the native build we also push the same reminder to the OS
   notification centre, once per reminder period (tracked in
   state.notified), so it's seen even when the app isn't open. */
function nativeNotifReady(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications);
}
async function ensureNotifPermission(){
  if(!nativeNotifReady()) return false;
  try{
    var LN = window.Capacitor.Plugins.LocalNotifications;
    var perm = await LN.checkPermissions();
    if(perm.display !== "granted") perm = await LN.requestPermissions();
    return perm.display === "granted";
  }catch(e){ console.warn("Office Ledger: notification permission check failed", e); return false; }
}
async function notifyOnce(key, title, body){
  if(state.notified && state.notified[key]) return;
  var ok = await ensureNotifPermission();
  if(!ok) return;
  try{
    await window.Capacitor.Plugins.LocalNotifications.schedule({
      notifications:[{
        id: Math.floor(Math.random()*2147000000),
        title: title, body: body,
        schedule:{ at: new Date(Date.now()+500) }
      }]
    });
    state.notified = state.notified || {};
    state.notified[key] = true;
    saveState();
  }catch(e){ console.warn("Office Ledger: could not send notification", e); }
}
async function sendPendingNotifications(){
  if(!nativeNotifReady()) return;
  var banners = reminderBanners();
  for(var i=0;i<banners.length;i++){
    var b = banners[i];
    await notifyOnce(b.key, b.title, b.body);
  }
}

/* ---------- office location auto-detection ----------
   Foreground-only: checked once when the app is opened (see init()), never
   in the background — no ACCESS_BACKGROUND_LOCATION, nothing running while
   the app is closed. A match is only ever offered, never applied silently:
   the person always taps "Mark present" themselves on the Today banner.
   Safety: never on a weekend, never overriding a day already logged, and
   each day is only ever offered once (confirmedDates/dismissedDates).
   Coordinates are compared entirely on-device against state.officeLocations
   — nothing about location is ever sent anywhere. */
function nativeGeoReady(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation);
}
async function ensureLocationPermission(){
  try{
    if(nativeGeoReady()){
      var Geo = window.Capacitor.Plugins.Geolocation;
      var perm = await Geo.checkPermissions();
      if(perm.location !== "granted" && perm.coarseLocation !== "granted") perm = await Geo.requestPermissions();
      return perm.location === "granted" || perm.coarseLocation === "granted";
    }
    return !!(navigator.geolocation);
  }catch(e){ console.warn("Office Ledger: location permission check failed", e); return false; }
}
/* Set alongside a null return from getCurrentPosition() so callers that
   care WHY it failed (the Settings live-status readout) can tell "you
   never granted permission" apart from "GPS just couldn't get a fix" —
   the native Capacitor path already knows the difference from
   checkPermissions(); the browser fallback only finds out from the
   geolocation error callback's PERMISSION_DENIED code (1). */
var lastGeoErrorCode = null;
async function getCurrentPosition(){
  lastGeoErrorCode = null;
  var ok = await ensureLocationPermission();
  if(!ok){ lastGeoErrorCode = "denied"; return null; }
  try{
    if(nativeGeoReady()){
      var pos = await window.Capacitor.Plugins.Geolocation.getCurrentPosition({enableHighAccuracy:true, timeout:15000, maximumAge:0});
      return {lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy};
    }
    if(!navigator.geolocation){ lastGeoErrorCode = "unavailable"; return null; }
    return await new Promise(function(resolve){
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy}); },
        function(err){
          console.warn("Office Ledger: geolocation error", err);
          lastGeoErrorCode = (err && err.code===1) ? "denied" : "unavailable"; // 1 === PERMISSION_DENIED
          resolve(null);
        },
        {enableHighAccuracy:true, timeout:15000, maximumAge:0}
      );
    });
  }catch(e){ console.warn("Office Ledger: could not read location", e); lastGeoErrorCode = "unavailable"; return null; }
}
function haversineMeters(lat1,lng1,lat2,lng2){
  var R = 6371000;
  var toRad = function(d){ return d*Math.PI/180; };
  var dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function findNearestOfficeMatch(lat,lng){
  var locs = state.officeLocations || [];
  var best = null;
  for(var i=0;i<locs.length;i++){
    var loc = locs[i];
    if(loc.lat==null || loc.lng==null) continue;
    var dist = haversineMeters(lat,lng,loc.lat,loc.lng);
    if(dist <= (loc.radiusM||300) && (!best || dist<best.dist)) best = {loc:loc, dist:dist};
  }
  return best;
}
var pendingOfficeMatch = null; // {loc, dist, dateStr} — surfaced as a confirm banner on Today
var pendingLocationNudge = null; // {dateStr} — shown instead, when auto-detect is on but today's
                         // location didn't match any saved office (a client site, a third office
                         // not added yet, working from a different city). People move between
                         // locations day to day, so a non-match is expected, not an error — but it
                         // also means GPS has nothing to log, and that's exactly the day someone's
                         // most likely to forget about. Rather than staying silent, this nudges a
                         // manual log instead of leaving the day to quietly go unmarked.
async function checkOfficeLocationAuto(){
  try{
    if(!state.locationSettings || !state.locationSettings.enabled) return;
    if(!(state.officeLocations||[]).length) return;
    var t = today();
    if(isWeekend(t)) return; // safety: never trigger on weekends, even if someone's nearby
    var dStr = todayStr();
    if(state.days[dStr] && state.days[dStr].status) return; // never override a day already logged
    if(state.locationSettings.confirmedDates[dStr] || state.locationSettings.dismissedDates[dStr]) return; // only ever ask once a day
    var pos = await getCurrentPosition();
    if(!pos) return;
    var match = findNearestOfficeMatch(pos.lat, pos.lng);
    if(match){
      pendingOfficeMatch = {loc:match.loc, dist:Math.round(match.dist), dateStr:dStr};
    } else {
      pendingLocationNudge = {dateStr:dStr};
    }
    renderCurrentView();
  }catch(e){ console.warn("Office Ledger: location auto-check failed", e); }
}
/* ---------- Settings' "live" GPS status readout ----------
   Not a background tracker — it's a point-in-time check, run once when
   Settings opens (or on demand via "Check GPS now"), that walks through
   the same permission + read + match steps checkOfficeLocationAuto()
   uses, and shows the result plainly: no permission, no signal, or how
   far the last reading was from the nearest saved office. Stops looking
   the instant the check resolves — consistent with the app never
   watching location continuously. */
var locStatusState = {status:"idle", text:"", checkedAt:null};
function fmtCheckedTime(ms){
  try{ return new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
  catch(e){ return ""; }
}
function renderLocationStatusUI(){
  var el = document.getElementById("locLiveStatus");
  if(!el) return;
  var cls = {
    off:"status-warn", checking:"status-warn", acquiring:"status-warn",
    denied:"status-critical", error:"status-critical",
    "active-match":"status-good", "active-nomatch":"status-warn"
  }[locStatusState.status] || "status-warn";
  el.innerHTML =
    '<span class="status-pill '+cls+'">'+esc(locStatusState.text)+'</span>'+
    (locStatusState.checkedAt ? '<span class="field-hint" style="margin:0;">Checked '+esc(fmtCheckedTime(locStatusState.checkedAt))+'</span>' : '');
}
async function refreshLocationStatus(){
  if(!state.locationSettings.enabled) return;
  locStatusState = {status:"checking", text:"Checking permission…", checkedAt:null};
  renderLocationStatusUI();
  var permOk = await ensureLocationPermission();
  if(!permOk){
    locStatusState = {status:"denied", text:"Permission needed — enable Location for Office Ledger in your phone's app settings", checkedAt:Date.now()};
    renderLocationStatusUI();
    return;
  }
  locStatusState = {status:"acquiring", text:"Acquiring GPS…", checkedAt:null};
  renderLocationStatusUI();
  var pos = await getCurrentPosition();
  if(!pos){
    locStatusState = (lastGeoErrorCode==="denied") ?
      {status:"denied", text:"Permission needed — enable Location for Office Ledger in your phone's app settings", checkedAt:Date.now()} :
      {status:"error", text:"No GPS signal right now — try again in a moment", checkedAt:Date.now()};
    renderLocationStatusUI();
    return;
  }
  var match = findNearestOfficeMatch(pos.lat, pos.lng);
  if(match){
    locStatusState = {status:"active-match", text:"GPS active — "+Math.round(match.dist)+"m from "+match.loc.name, checkedAt:Date.now()};
  } else {
    var locs = state.officeLocations||[], nearest=null;
    for(var i=0;i<locs.length;i++){
      var l = locs[i];
      if(l.lat==null||l.lng==null) continue;
      var d = haversineMeters(pos.lat,pos.lng,l.lat,l.lng);
      if(!nearest || d<nearest.dist) nearest = {loc:l, dist:d};
    }
    locStatusState = nearest ?
      {status:"active-nomatch", text:"GPS active — "+Math.round(nearest.dist)+"m from "+nearest.loc.name+", outside its "+(nearest.loc.radiusM||300)+"m range", checkedAt:Date.now()} :
      {status:"active-nomatch", text:"GPS active — no saved office nearby", checkedAt:Date.now()};
  }
  renderLocationStatusUI();
}
function confirmOfficeMatch(){
  if(!pendingOfficeMatch) return;
  var dStr = pendingOfficeMatch.dateStr;
  var officeName = pendingOfficeMatch.loc.name;
  state.days[dStr] = {status:"present", leaveType:null};
  state.locationSettings.confirmedDates[dStr] = true;
  state.locationSettings.confirmedOffice = state.locationSettings.confirmedOffice || {};
  state.locationSettings.confirmedOffice[dStr] = officeName;
  state.locationSettings.celebrationShownDates = state.locationSettings.celebrationShownDates || {};
  state.locationSettings.celebrationShownDates[dStr] = true;
  pendingOfficeMatch = null;
  saveState();
  renderCurrentView();
  showGpsCelebration(officeName);
}
function dismissOfficeMatch(){
  if(!pendingOfficeMatch) return;
  state.locationSettings.dismissedDates[pendingOfficeMatch.dateStr] = true;
  pendingOfficeMatch = null;
  saveState();
  renderCurrentView();
}
function openLocationNudge(){
  if(!pendingLocationNudge) return;
  openDaySheet(pendingLocationNudge.dateStr);
}
function dismissLocationNudge(){
  if(!pendingLocationNudge) return;
  state.locationSettings.dismissedDates[pendingLocationNudge.dateStr] = true;
  pendingLocationNudge = null;
  saveState();
  renderCurrentView();
}

/* ---------- GPS celebration animation ----------
   A full-screen, one-time-a-day reveal: a "stamped" present mark with a
   burst of ink-coloured particles (canvas, no library), shown the moment
   someone confirms a GPS match, and — the actual point of this feature —
   ALSO the next time the app is opened or resumed, even hours later, if
   today's already been logged via GPS and this hasn't played yet today.
   That second path is what makes "I checked in at 9am, came back to the
   app at 9pm" still get the reveal. Deduped by celebrationShownDates so
   it never replays the same day, however many times the app is reopened. */
function buildGpsCelebrationDom(){
  if(document.getElementById("gpsCelebration")) return;
  var overlay = document.createElement("div");
  overlay.id = "gpsCelebration";
  overlay.className = "gps-celebration-overlay";
  overlay.setAttribute("aria-hidden","true");
  overlay.innerHTML =
    '<canvas id="gpsCelebrationCanvas" class="gps-celebration-canvas"></canvas>'+
    '<div class="gps-celebration-content">'+
      '<div class="gps-stamp">'+
        '<svg class="gps-stamp-ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"></circle></svg>'+
        '<svg class="gps-stamp-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'+
      '</div>'+
      '<div class="gps-celebration-text">'+
        '<div class="gps-celebration-title">Present — logged</div>'+
        '<div class="gps-celebration-sub"></div>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener("click", hideGpsCelebration);
}
function burstGpsParticles(canvas){
  var ctx = canvas.getContext("2d");
  if(!ctx) return function(){};
  var reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var dpr = window.devicePixelRatio||1;
  var w = canvas.clientWidth||window.innerWidth, h = canvas.clientHeight||window.innerHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var cx = w/2, cy = h/2 - 44;
  var css = getComputedStyle(document.documentElement);
  var colors = [
    (css.getPropertyValue("--good")||"#2E9E5B").trim(),
    (css.getPropertyValue("--accent")||"#0B63C4").trim(),
    "#ffffff"
  ];
  var particles = [];
  var count = reduced ? 0 : 48;
  for(var i=0;i<count;i++){
    var ang = Math.random()*Math.PI*2;
    var speed = 2.1+Math.random()*4.4;
    particles.push({
      x:cx, y:cy, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed-1.6,
      size:2+Math.random()*3, color:colors[i%colors.length],
      life:1, decay:0.011+Math.random()*0.013
    });
  }
  var raf=null;
  function tick(){
    ctx.clearRect(0,0,w,h);
    var alive=false;
    particles.forEach(function(p){
      if(p.life<=0) return;
      alive=true;
      p.vy += 0.09; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(alive) raf = requestAnimationFrame(tick);
  }
  if(count>0) raf = requestAnimationFrame(tick);
  return function cleanup(){ if(raf) cancelAnimationFrame(raf); ctx.clearRect(0,0,w,h); };
}
var gpsCelebrationTimer=null, gpsCelebrationCleanup=null;
function showGpsCelebration(officeName){
  buildGpsCelebrationDom();
  var overlay = document.getElementById("gpsCelebration");
  if(!overlay) return;
  var sub = overlay.querySelector(".gps-celebration-sub");
  if(sub) sub.textContent = (officeName ? officeName+" · " : "")+"Logged via GPS · "+fmtLong(today());
  overlay.setAttribute("aria-hidden","false");
  // restart the CSS animations even if shown again shortly after
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  if(gpsCelebrationCleanup){ gpsCelebrationCleanup(); gpsCelebrationCleanup=null; }
  var canvas = document.getElementById("gpsCelebrationCanvas");
  if(canvas){
    setTimeout(function(){ if(overlay.classList.contains("show")) gpsCelebrationCleanup = burstGpsParticles(canvas); }, 260);
  }
  clearTimeout(gpsCelebrationTimer);
  gpsCelebrationTimer = setTimeout(hideGpsCelebration, 3200);
}
function hideGpsCelebration(){
  var overlay = document.getElementById("gpsCelebration");
  if(!overlay) return;
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  clearTimeout(gpsCelebrationTimer);
  if(gpsCelebrationCleanup){ gpsCelebrationCleanup(); gpsCelebrationCleanup=null; }
}
/* Called on cold start AND every time the app becomes visible again
   (tab switch, or brought forward from the Android task switcher) — see
   the visibilitychange/resume listeners wired in init(). Only plays if
   today is already GPS-confirmed and the reveal hasn't run yet today. */
function maybeShowGpsCelebration(){
  if(!state || !state.locationSettings) return;
  var dStr = todayStr();
  if(!state.locationSettings.confirmedDates || !state.locationSettings.confirmedDates[dStr]) return;
  if(state.locationSettings.celebrationShownDates && state.locationSettings.celebrationShownDates[dStr]) return;
  state.locationSettings.celebrationShownDates = state.locationSettings.celebrationShownDates || {};
  state.locationSettings.celebrationShownDates[dStr] = true;
  saveState();
  var officeName = (state.locationSettings.confirmedOffice && state.locationSettings.confirmedOffice[dStr]) || null;
  showGpsCelebration(officeName);
}

/* ---------- WFH day-start / day-end reminders ----------
   Fixed daily-repeating native notifications (schedule.on with only
   hour/minute repeats every day) so nobody forgets to log a WFH day.
   Fixed IDs so re-saving settings cancels and reschedules cleanly instead
   of piling up duplicates. Android-only — same as the rest of the app's
   notification-centre pushes, there is no way for a closed iOS/PWA tab to
   fire a notification on its own. */
var WFH_REMINDER_IDS = { start:9001, end:9002 };
async function scheduleWfhReminders(){
  if(!nativeNotifReady()) return;
  try{
    var LN = window.Capacitor.Plugins.LocalNotifications;
    await LN.cancel({ notifications:[{id:WFH_REMINDER_IDS.start},{id:WFH_REMINDER_IDS.end}] });
    if(!state.wfhReminders || !state.wfhReminders.enabled) return;
    var ok = await ensureNotifPermission();
    if(!ok) return;
    var sp = (state.wfhReminders.startTime||"09:15").split(":");
    var ep = (state.wfhReminders.endTime||"17:45").split(":");
    await LN.schedule({ notifications:[
      { id:WFH_REMINDER_IDS.start, title:"Log today's attendance", body:"Don't forget to mark today in Office Ledger.",
        schedule:{ on:{ hour:parseInt(sp[0],10), minute:parseInt(sp[1],10) }, allowWhileIdle:true } },
      { id:WFH_REMINDER_IDS.end, title:"Still need to log today?", body:"A quick check before the day ends — mark it in Office Ledger.",
        schedule:{ on:{ hour:parseInt(ep[0],10), minute:parseInt(ep[1],10) }, allowWhileIdle:true } }
    ]});
  }catch(e){ console.warn("Office Ledger: could not schedule WFH reminders", e); }
}

/* If the financial-year-to-date % is below target, work out whether it's
   still mathematically reachable by FY end (30 Sep) given the eligible
   working days left, and if so, exactly where those days fall.
   Deliberately NOT "needed ÷ calendar months left": that always counts
   today's own month as a whole month of runway even with only a day or
   two actually remaining in it, which overstates how much is realistically
   left to do there. Instead this looks up each remaining month's own
   still-pending eligible days directly, so a nearly-over month correctly
   shows up as having almost nothing left, and the days needed land where
   they can actually happen. */
function fyRecoveryMessage(stats, target, fy, t){
  if(stats.pctResolved===null || stats.pctResolved>=target) return null;
  var neededMore = Math.max(0, Math.ceil(target/100*stats.eligibleFull) - stats.attendedFull);
  var remaining = stats.pending;
  if(neededMore===0){
    return "There are still enough eligible days left in "+fy.label+" that keeping up attendance can bring you back to "+target+"% by year end.";
  }
  if(remaining===0){
    return "The eligible working days for "+fy.label+" are over — "+target+"% was not reached this financial year.";
  }
  if(neededMore>remaining){
    var bestCase = stats.eligibleFull>0 ? ((stats.attendedFull+remaining)/stats.eligibleFull*100) : null;
    return "Even attending every remaining eligible day in "+fy.label+", the best reachable is <b>"+Math.round(bestCase)+"%</b> — below the "+target+"% target.";
  }
  var tStr = todayStr();
  var breakdown = fyMonths(fy).map(function(mo){
    var mr = monthRangeStr(mo.year, mo.month);
    if(mr.end < tStr) return null; // this month already fully resolved — nothing pending here
    var s = monthStats(mo.year, mo.month, tStr);
    if(s.pending<=0) return null;
    var isCurrent = (mo.year===t.getFullYear() && mo.month===t.getMonth());
    return plural(s.pending,"day") + (isCurrent ? " left this month" : " in "+MONTH_NAMES[mo.month]);
  }).filter(Boolean).join(", ");
  return "To recover to "+target+"% by the end of "+fy.label+", attend <b>"+plural(neededMore,"more day")+"</b> out of the <b>"+plural(remaining,"eligible day")+"</b> left"+(breakdown?" — "+breakdown:"")+".";
}

function fyTrendTable(fy){
  var tStr = todayStr();
  var anyOverride = false;
  var rows = fyMonths(fy).map(function(mo){
    var mr = monthRangeStr(mo.year, mo.month);
    if(mr.start > tStr) return null; // month hasn't started yet
    var s = monthStats(mo.year, mo.month, tStr);
    if(!s.overridden && s.eligibleResolved===0 && s.attended===0) return null; // nothing tracked this month
    if(s.overridden) anyOverride = true;
    return '<tr><td>'+MONTH_SHORT[mo.month]+' '+mo.year+(s.overridden?' <span class="mono" style="color:var(--ink-faint);font-size:10px;" title="Manually backfilled">†</span>':'')+'</td>'+
      '<td class="num mono">'+s.eligibleResolved+'</td>'+
      '<td class="num mono">'+s.attended+'</td>'+
      '<td class="num mono">'+fmtPct(s.pctResolved)+'</td></tr>';
  }).filter(Boolean);
  if(!rows.length) return '<p class="subtext">Monthly trend appears here once a month is underway.</p>';
  return '<span class="eyebrow">Month by month</span>'+
    '<div class="table-scroll" style="margin-top:8px;"><table class="summary-table">'+
    '<tr><th>Month</th><th class="num">Eligible</th><th class="num">Attended</th><th class="num">%</th></tr>'+
    rows.join("")+
    '</table></div>'+
    (anyOverride ? '<p class="subtext" style="margin-top:8px;">† manually backfilled, not from day-by-day marks.</p>' : '');
}

/* Home's hero card carries two slides — "this month" and the FY aggregate —
   swiped between horizontally. Rebuilt fresh each renderToday() call, so
   wiring (and the touch listeners) is re-attached every time; always opens
   back on the month slide. Deliberately independent of pull-to-refresh's
   own touch listeners: a horizontal drag here calls stopPropagation once
   committed, so it can't also trigger a refresh pull. */
function setupStatHeroSwipe(){
  var card = document.getElementById("statHeroCard");
  var track = document.getElementById("statHeroTrack");
  var dots = document.querySelectorAll("#statHeroDots .stat-hero-dot");
  if(!card || !track) return;
  var slide = 0, startX=null, startY=null, dragging=false, committed=false, deltaX=0, width=0;

  function apply(pct, animate){
    track.style.transition = animate ? "" : "none";
    track.style.transform = "translateX("+pct+"%)";
  }
  function setSlide(i){
    slide = Math.max(0, Math.min(1, i));
    apply(-(slide*50), true);
    dots.forEach(function(d,idx){ d.classList.toggle("on", idx===slide); });
  }
  card.addEventListener("touchstart", function(e){
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dragging = false; committed = false; deltaX = 0;
    width = card.getBoundingClientRect().width;
  }, {passive:true});
  card.addEventListener("touchmove", function(e){
    if(startX===null) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if(!dragging){
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      dragging = true;
      committed = Math.abs(dx) > Math.abs(dy);
      if(!committed) return;
    }
    if(!committed) return;
    e.preventDefault();
    e.stopPropagation();
    deltaX = dx;
    var pct = Math.max(-50, Math.min(0, -(slide*50) + (dx/width)*50));
    apply(pct, false);
  }, {passive:false});
  card.addEventListener("touchend", function(e){
    if(committed){
      e.stopPropagation();
      var threshold = width*0.22;
      if(deltaX < -threshold && slide===0) setSlide(1);
      else if(deltaX > threshold && slide===1) setSlide(0);
      else setSlide(slide);
    }
    startX = null; dragging = false; committed = false; deltaX = 0;
  }, {passive:true});

  setSlide(0);
}

function renderToday(){
  var t = today();
  var mr = monthRangeStr(t.getFullYear(), t.getMonth());
  var soFar = rangeStats(mr.start, mr.end, todayStr());
  var target = state.profile.targetPct;

  var oppLeft = soFar.pending; // remaining plain weekdays left this month, not yet resolved
  var neededFull = Math.max(0, Math.ceil(target/100*soFar.eligibleFull) - soFar.attendedFull);
  var bestCasePct = soFar.eligibleFull>0 ? ((soFar.attendedFull+oppLeft)/soFar.eligibleFull*100) : null;

  var toTargetMsg;
  if(soFar.eligibleResolved===0 && oppLeft===0){
    toTargetMsg = "No eligible working days this month.";
  } else if(neededFull===0){
    toTargetMsg = soFar.eligibleResolved>0
      ? "You're at or above target for the "+soFar.eligibleResolved+" eligible day"+(soFar.eligibleResolved===1?"":"s")+" so far."
      : "Target already secured for this month.";
  } else if(oppLeft===0){
    toTargetMsg = "The month's working days are done — target of "+target+"% was not reached.";
  } else if(neededFull>oppLeft){
    toTargetMsg = "Even attending every remaining working day this month, the best reachable is <b>"+Math.round(bestCasePct)+"%</b> — below the "+target+"% target.";
  } else {
    toTargetMsg = "Attend <b>"+plural(neededFull,"more day")+"</b> in the remaining <b>"+plural(oppLeft,"working day")+"</b> this month to reach "+target+"%.";
  }

  var fy = fyOf(t);
  var fyStats = fyAggregateStats(fy);
  var fyRecovery = fyRecoveryMessage(fyStats, target, fy, t);

  var banners = reminderBanners().map(function(b){
    return '<div class="banner" data-bkey="'+b.key+'">'+
      '<div class="banner-text"><strong>'+esc(b.title)+'</strong>'+esc(b.body)+
        '<div class="banner-actions"><button class="banner-btn" data-baction="'+b.key+'">Update now</button></div>'+
      '</div>'+
      '<button class="banner-dismiss" data-bdismiss="'+b.key+'" aria-label="Dismiss">×</button>'+
    '</div>';
  }).join("");

  var officeBanner = pendingOfficeMatch ?
    '<div class="banner" style="border-color:var(--accent);">'+
      '<div class="banner-text"><strong>Looks like you\'re at '+esc(pendingOfficeMatch.loc.name)+'</strong>'+
        'Your location matched, about '+pendingOfficeMatch.dist+'m from the office. Mark today as present?'+
        '<div class="banner-actions">'+
          '<button class="banner-btn" id="officeMatchConfirm">Mark present</button>'+
          '<button class="banner-btn" id="officeMatchDismiss" style="background:var(--surface-2); color:var(--text);">Not today</button>'+
        '</div>'+
      '</div>'+

/* ---------- CALENDAR view ---------- */
function renderCalendar(){
  var y=calCursor.year, m=calCursor.month;
  var hMap = holidayMap();
  var first = new Date(y,m,1);
  var lead = mondayIndex(first);
  var total = daysInMonth(y,m);
  var tStr = todayStr();

  var monthKey = monthOverrideKey(y,m);
  var plannable = monthIsPlannable(y,m);
  var planOn = isPlanModeOn(monthKey);
  var planCount = planCountForMonth(monthKey);

  var cells = "";
  for(var i=0;i<lead;i++) cells += '<div class="cal-cell empty"></div>';
  for(var day=1; day<=total; day++){
    var ds = iso(y,m,day);
    var isPast = ds <= tStr;
    var planned = (!isPast && planOn && !hMap[ds] && !(state.days[ds]&&state.days[ds].status)) ? state.plan[ds] : null;
    var cssClass, planCls="";
    if(planned && planned.status){
      cssClass = "st-"+planned.status;
      planCls = " is-planned";
    } else {
      var cls = classifyDay(ds, hMap);
      cssClass = cls==="unmarked" ? (isPast ? "st-unmarked-past" : "st-future") : "st-"+cls;
    }
    var todayCls = ds===tStr ? " is-today" : "";
    cells += '<div class="cal-cell '+cssClass+planCls+todayCls+'" data-date="'+ds+'">'+day+'</div>';
  }

  var mr = monthRangeStr(y,m);
  var stats = monthStats(y, m, tStr);
  var weekdayTotal = stats.eligibleFull + stats.leave + stats.holiday + stats.compoff - stats.weekendWorked;
  // This month's own forecast — separate from the FY-wide "Projected" card
  // below, which blends every month together. Only shown once this month
  // actually has planned days, so "what would THIS month look like" has a
  // direct answer instead of being buried in the FY total.
  var monthProjStats = (planOn && planCount>0) ? monthStats(y, m, tStr, classifyDayWithPlan) : null;

  var fy = fyOf(today());
  var fyStats = fyAggregateStats(fy);

  // Projected card: scoped to whichever FY the browsed month belongs to (so
  // planning ahead into next FY still shows its own trajectory), and only
  // shown at all once a plan actually exists somewhere in that FY.
  var planFy = fyOf(new Date(y,m,1));
  var planFyStartStr = isoOf(planFy.start), planFyEndStr = isoOf(planFy.end);
  var hasPlanInFy = Object.keys(state.plan||{}).some(function(ds){ return ds>=planFyStartStr && ds<=planFyEndStr; });
  var planForecastHtml = "";
  if(hasPlanInFy){
    var projStats = fyAggregateStats(planFy, classifyDayWithPlan);
    var sameFy = planFy.startYear===fy.startYear;
    planForecastHtml =
      '<div class="card" id="planForecastCard">'+
        '<div class="card-row"><span class="eyebrow">Projected'+(sameFy?"":" — "+esc(planFy.label))+'</span><span class="status-pill '+pctColorClass(projStats.pctFull,state.profile.targetPct)+'">'+fmtPct(projStats.pctFull)+'</span></div>'+
        '<p class="subtext" style="margin-top:6px;">Where '+esc(planFy.label)+' lands if you follow the plan you\'ve set below — it\'s a forecast, and won\'t count toward your real percentage until each planned day actually happens.</p>'+
      '</div>';
  }

  var html =
    '<div class="card">'+
      '<div class="cal-nav">'+
        '<button class="cal-nav-btn" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 6 9 12 15 18"></polyline></svg></button>'+
        '<div><div class="cal-month-label">'+MONTH_NAMES[m]+' '+y+'</div><button class="cal-today-link" id="calToday">Today</button></div>'+
        '<button class="cal-nav-btn" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 6 15 12 9 18"></polyline></svg></button>'+
      '</div>'+
      '<div class="cal-grid">'+
        DOW_LABELS.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join("")+
        cells+
      '</div>'+
      '<div class="legend" style="margin-top:14px;">'+
        legendItem("var(--good)","Present / Worked wknd")+
        legendItem("var(--warn)","Leave")+
        legendItem("var(--holiday)","Public holiday")+
        legendItem("var(--accent)","Comp off")+
        legendItem("var(--wfh)","Work from home")+
        legendItem("var(--critical)","Unmarked (past)")+
        (planOn ? '<div class="legend-item"><span class="legend-swatch" style="background:transparent; border:1.5px dashed var(--ink-soft);"></span>Planned</div>' : "")+
      '</div>'+
      (plannable || planOn ?
        '<div class="plan-toggle-row">'+
          '<div>'+
            '<div class="plan-toggle-label">Plan mode</div>'+
            '<div class="subtext" style="margin-top:2px;">Try a schedule for '+MONTH_NAMES[m]+' — it won\'t count toward your real percentage.</div>'+
          '</div>'+
          '<label class="switch">'+
            '<input type="checkbox" id="planModeToggle"'+(planOn?" checked":"")+(!plannable&&!planOn?" disabled":"")+'>'+
            '<span class="switch-track"></span>'+
          '</label>'+
        '</div>'
      : "")+
    '</div>'+
    '<div class="card" id="monthSummaryCard">'+
      '<span class="eyebrow">Month summary</span>'+
      (stats.overridden ? '<p class="subtext" style="margin-top:4px; color:var(--ink-faint);">Manually backfilled — the totals below are what you entered, not individual day marks.</p>' : '')+
      '<div class="kv-list" style="margin-top:6px;">'+
        kvRow("Weekdays in month", weekdayTotal)+
        kvRow("Leave days", stats.leave)+
        kvRow("Public holidays", stats.holiday)+
        kvRow("Comp off taken", stats.compoff)+
        kvRow("Work from home", stats.wfh)+
        kvRow("Weekend days worked", stats.weekendWorked)+
        kvRow("Eligible working days (to date)", stats.eligibleResolved)+
        kvRow("Attended", stats.attended)+
      '</div>'+
      '<hr class="divider" style="margin:10px 0;">'+
      '<div class="card-row"><span style="font-weight:600;">Attendance</span><span class="status-pill '+pctColorClass(stats.pctResolved,state.profile.targetPct)+'">'+fmtPct(stats.pctResolved)+'</span></div>'+
      (monthProjStats ?
        '<div class="card-row" style="margin-top:8px;"><span style="font-weight:600;">Projected</span><span class="status-pill '+pctColorClass(monthProjStats.pctFull,state.profile.targetPct)+'">'+fmtPct(monthProjStats.pctFull)+'</span></div>'+
        '<p class="subtext" style="margin-top:4px;">'+plural(planCount,"day")+' planned this month, out of '+monthProjStats.eligibleFull+' eligible — forecast only, doesn\'t count until you log the real day.</p>'
      : '')+
    '</div>'+
    '<div class="card" id="fyTrendCard">'+
      '<div class="card-row"><span class="eyebrow">'+fy.label+' to date</span><span class="status-pill '+pctColorClass(fyStats.pctResolved,state.profile.targetPct)+'">'+fmtPct(fyStats.pctResolved)+(fyStats.totalOverridden?' †':'')+'</span></div>'+
      (fyStats.totalOverridden
        ? '<p class="subtext" style="margin-top:6px;">Manually set to match your official total — the month-by-month breakdown below is still built from its own per-month figures, so its own weighted average may read slightly differently.</p>'
        : '<p class="subtext" style="margin-top:6px;">'+fyStats.attended+' of '+fyStats.eligibleResolved+' eligible days attended since '+fmtShort(fy.start)+' — aggregated across every month below.</p>')+
      (fyRecoveryMessage(fyStats, state.profile.targetPct, fy, today()) ? '<p class="to-target" style="margin-top:8px;">'+fyRecoveryMessage(fyStats, state.profile.targetPct, fy, today())+'</p>' : '')+
      '<hr class="divider" style="margin:14px 0;">'+
      fyTrendTable(fy)+
    '</div>'+
    planForecastHtml;

  var v = document.getElementById("view-calendar");
  v.innerHTML = html;
  v.querySelectorAll(".cal-cell[data-date]").forEach(function(c){
    c.addEventListener("click", function(){
      var ds = c.getAttribute("data-date");
      if(ds > tStr && isPlanModeOn(planMonthKey(ds)) && !hMap[ds]) openPlanDaySheet(ds);
      else openDaySheet(ds);
    });
  });
  var pmToggle = document.getElementById("planModeToggle");
  if(pmToggle){
    pmToggle.addEventListener("change", function(){
      if(pmToggle.checked){
        state.planMonths[monthKey] = true;
        saveState();
        renderCalendar();
      } else if(planCount>0){
        pmToggle.checked = true; // hold visually until the clear is confirmed
        openPlanClearConfirm(monthKey, MONTH_NAMES[m]+" "+y, planCount);
      } else {
        delete state.planMonths[monthKey];
        saveState();
        renderCalendar();
      }
    });
  }
  document.getElementById("calPrev").addEventListener("click", function(){ shiftMonth(-1); });
  document.getElementById("calNext").addEventListener("click", function(){ shiftMonth(1); });
  document.getElementById("calToday").addEventListener("click", function(){ calCursor={year:today().getFullYear(), month:today().getMonth()}; renderCalendar(); });
}
function legendItem(color,label){
  return '<div class="legend-item"><span class="legend-swatch" style="background:'+color+';"></span>'+label+'</div>';
}
function kvRow(label,val){
  return '<div class="kv-row"><span>'+label+'</span><span class="v mono">'+val+'</span></div>';
}
function shiftMonth(delta){
  var m=calCursor.month+delta, y=calCursor.year;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  calCursor={year:y, month:m};
  renderCalendar();
}

    '<span class="eyebrow">'+opts.title+'</span>'+

    '<div style="display:flex; align-items:baseline; gap:8px; margin:14px 0 4px;">'+

      '<span class="subtext">days'+(pool.lastUpdated?(" · as of "+fmtShort(pool.lastUpdated)):"")+'</span>'+
    '</div>'+
    '<form id="'+opts.formId+'" style="margin-top:10px; flex-direction:row; align-items:flex-end; gap:8px;">'+
      '<div class="field" style="flex:1;"><label for="'+opts.inputId+'">Update balance (days)</label>'+

function renderLeave(){
  var co = compOffBalance();

  var html =
    '<div><div class="eyebrow">Leave &amp; comp off</div><h1 class="page-title">Balances</h1></div>'+
    leavePoolCardHtml(state.annualLeave, {
      id:"annualPoolCard",
      title:"Annual leave pool",
      desc:"Its own pool, separate from Sick/Carer. Report it from your HR system — a drop since your last update counts as leave taken and reduces eligible working days for that month, even for days you haven't marked individually on the Calendar.",
      formId:"annualLeaveForm", inputId:"annualLeaveInput"
    })+
    leavePoolCardHtml(state.carerSickLeave, {
      id:"carerSickPoolCard",
      title:"Sick / Carer leave pool",
      desc:"Shared pool — Sick and Carer leave both draw from this same balance, separate from Annual leave. Same rule: a drop since your last update counts toward eligible working days for that month.",
      formId:"carerSickLeaveForm", inputId:"carerSickLeaveInput"
    })+
    '<div class="card">'+
      '<span class="eyebrow">Comp off</span>'+
      '<p class="subtext" style="margin-top:2px;">Earned automatically when you log a worked weekend, and spent when you mark a comp off day on the calendar.</p>'+
      '<div style="display:flex; align-items:baseline; gap:8px; margin:14px 0 4px;">'+
        '<span class="mono" style="font-size:34px; font-weight:600;">'+co.balance+'</span><span class="subtext">days available</span>'+
      '</div>'+

        kvRow("Earned (weekends worked)", "+"+co.worked)+
        kvRow("Taken", "−"+co.taken)+
      '</div>'+
    '</div>';

  var v = document.getElementById("view-leave");

  function wirePoolForm(formId, inputId, poolKey, label){

      showToast(label+" balance updated");

      renderCurrentView();

}

      '<span class="eyebrow">All holidays</span>'+
      '<div style="margin-top:6px;">'+itemsHtml+'</div>'+
    '</div>';

async function exportBackup(){
  var payload = JSON.stringify(state, null, 2);
  var filename = "office-ledger-backup-"+todayStr()+".json";
  try{
    if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
      var Filesystem = window.Capacitor.Plugins.Filesystem;
      var Share = window.Capacitor.Plugins.Share;
      var written = await Filesystem.writeFile({ path: filename, data: payload, directory: "CACHE", encoding: "utf8" });
      await Share.share({ title: "Office Ledger backup", url: written.uri });
      showToast("Backup ready to share");
      return;
    }
  }catch(e){ console.warn("Office Ledger: native export failed", e); }
  try{
    var downloads = window.claude ? await window.claude.use("downloads") : null;
    if(downloads){
      await downloads.save({filename:filename, data:payload});
      showToast("Backup ready to save");
      return;
    }
  }catch(e){ /* fall through to manual copy */ }
  try{
    var blob = new Blob([payload], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast("Backup downloaded");
  }catch(e){
    prompt("Copy your backup JSON:", payload);
  }
}

function optBtn(status,label,selected,color){
  return '<button type="button" class="option-btn'+(selected?" selected":"")+'" data-status="'+status+'"><span class="dot" style="background:'+color+';"></span>'+label+'</button>';
}
function setDay(dateStr, status, leaveType){
  state.days[dateStr] = {status:status, leaveType:leaveType||null};
  if(pendingOfficeMatch && pendingOfficeMatch.dateStr===dateStr) pendingOfficeMatch=null;
  if(pendingLocationNudge && pendingLocationNudge.dateStr===dateStr) pendingLocationNudge=null;
  saveState();
  showToast("Saved");
  renderCurrentView();
}
function clearDay(dateStr){
  delete state.days[dateStr];
  saveState();
  showToast("Cleared");
  renderCurrentView();
}

/* ---------- Hidden backfill tool (personal testing only) ----------
   Tap the FY chip in the top bar 7 times within 2 seconds to open it — the
   same "tap the build number" idiom used to unlock Android developer
   options. Not discoverable from any menu on purpose: it's for entering a
   known historical percentage for a month tracked before day-by-day
   logging started, so the FY aggregate can be tested/backfilled without
   faking hundreds of individual day marks. */
function setupBackfillTrigger(){
  var chip = document.getElementById("fyChip");
  var count = 0, resetTimer = null;
  chip.addEventListener("click", function(){
    count++;
    clearTimeout(resetTimer);
    resetTimer = setTimeout(function(){ count = 0; }, 2000);
    if(count>=7){
      count = 0;
      clearTimeout(resetTimer);
      openBackfillSheet();
    }
  });
}
/* Percentage is all most backfilled months have (an HR portal or a manual
   spreadsheet rarely hands you exact day counts). To still sum correctly
   into a weighted FY total, each row needs SOME eligible-day count as the
   basis for that percentage — defaulted to the number of weekdays in the
   month (editable, in case the real basis excluded holidays or was
   otherwise different), and attended is derived from percentage × basis. */
function weekdaysInMonth(y,m){
  var total = daysInMonth(y,m), n=0;
  for(var d=1; d<=total; d++){ if(!isWeekend(new Date(y,m,d))) n++; }
  return n;
}
function bfRowPreview(row){
  var pctInput = row.querySelector(".bf-pctinput");
  var basisInput = row.querySelector(".bf-basis");
  var preview = row.querySelector(".bf-preview");
  var pct = parseFloat(pctInput.value);
  var basis = Math.max(0, parseInt(basisInput.value,10) || 0);
  if(isNaN(pct) || basis<=0){ preview.textContent = "Enter a percentage and day basis."; return; }
  var attended = Math.max(0, Math.min(basis, Math.round(pct/100*basis)));
  preview.textContent = "≈ "+attended+" of "+basis+" days";
}

/* ---------- About & update check ---------- */
function compareVersions(a,b){
  var pa=String(a).split(".").map(function(n){return parseInt(n,10)||0;});
  var pb=String(b).split(".").map(function(n){return parseInt(n,10)||0;});
  for(var i=0;i<Math.max(pa.length,pb.length);i++){
    var na=pa[i]||0, nb=pb[i]||0;
    if(na>nb) return 1;
    if(na<nb) return -1;
  }
  return 0;
}
async function openExternal(url){
  try{
    if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins.Browser){
      await window.Capacitor.Plugins.Browser.open({url:url});
      return;
    }
  }catch(e){ console.warn("Office Ledger: native browser open failed", e); }
  window.open(url, "_blank");
}
async function syncStatusBar(){
  try{
    if(!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins.StatusBar)) return;
    var themeAttr = document.documentElement.getAttribute("data-theme");
    var dark = themeAttr === "dark" || (themeAttr !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    // Dark background -> light icons (Style.Dark); light background -> dark icons (Style.Light)
    await window.Capacitor.Plugins.StatusBar.setStyle({style: dark ? "DARK" : "LIGHT"});
  }catch(e){ console.warn("Office Ledger: status bar style sync failed", e); }
}
async function fetchLatestRelease(){
  var res = await fetch("https://api.github.com/repos/"+UPDATE_REPO+"/releases/latest", {
    headers:{"Accept":"application/vnd.github+json"}
  });
  if(!res.ok) throw new Error("GitHub API returned "+res.status);
  var data = await res.json();
  var apkAsset = (data.assets||[]).find(function(a){ return /\.apk$/i.test(a.name||""); });
  return {
    tag:(data.tag_name||"").replace(/^v/i,""),
    url:data.html_url,
    apkUrl: apkAsset ? apkAsset.browser_download_url : null,
    apkName: apkAsset ? apkAsset.name : "update.apk"
  };
}
function notifyUpdateAvailable(tag){
  if(!state || !tag) return;
  if(state.lastNotifiedVersion === tag) return; // already raised for this version
  state.lastNotifiedVersion = tag;
  saveState();
  var title = "Update available";
  var body = "Version "+tag+" is available — you're on "+APP_VERSION+".";
  addNotification("update", title, body);
  // Also push to the phone's own notification panel, not just the in-app
  // inbox, so it's seen even if the app isn't open — same mechanism the
  // day-logging reminders already use, deduped per version via its own key.
  notifyOnce("update-"+tag, title, body);
}
/* True only on the native Android build, with both the Filesystem plugin
   (to download the APK) and the custom ApkInstaller plugin (to hand it to
   the OS package installer) present. Anywhere else — iOS, the web preview,
   or an older build without ApkInstaller — the update flow falls back to
   just opening the release page in a browser. */
function apkInstallReady(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    && window.Capacitor.getPlatform && window.Capacitor.getPlatform()==="android"
    && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem && window.Capacitor.Plugins.ApkInstaller);
}
/* Everywhere apkInstallReady() is false, this is the PWA — installed to a
   home screen (standalone display mode, or iOS Safari's Add to Home
   Screen) or just open in a browser tab. Either way there's no APK to
   hand to a package installer, so the update flow is fundamentally
   different: a service worker can silently fetch the new version in the
   background, but it can never rewrite a page that's already loaded in
   memory — only reopening (or an automatic reload once the new version
   takes over, wired in the PWA's own bootstrap script) actually shows it.
   Nudges the installed web app to pick up a new version: asks its own
   service worker to re-check the network right now (normally a browser
   only does this occasionally on its own), then explains — because
   there is no single "tap to finish" step here the way there is on
   Android — that the actual switch-over happens automatically within a
   few seconds if this window stays open, or the next time it's fully
   closed and reopened otherwise. */
function applyPwaUpdate(rel, btn, statusEl){
  var originalLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Updating…"; }
  if(statusEl) statusEl.textContent = "Checking in the background — this stays open for a few seconds while it fetches "+esc(rel.tag)+".";
  try{
    if("serviceWorker" in navigator && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(reg){ if(reg) reg.update(); });
    }
  }catch(e){ console.warn("Office Ledger: PWA update check failed", e); }
  setTimeout(function(){
    if(statusEl) statusEl.innerHTML =
      "Unlike the Android app, an installed web app can't swap itself in instantly — it finishes on its own, usually within a few seconds, and this screen will reload itself when it does. Still on "+esc(APP_VERSION)+" after a bit? Fully close Office Ledger — swipe it away from your recent apps, or close every tab it's open in, not just switch away from it — then reopen it once. That's the ceiling of what's ever needed; there's no reinstalling, no removing and re-adding the icon, ever. And it's completely safe either way: your logged days, offices and leave balances live in a separate storage the update never touches, so nothing gets reset.";
    if(btn){ btn.disabled = false; btn.textContent = originalLabel || "Update the app"; }
  }, 4500);
}
function handleUpdateAction(rel, btn, statusEl){
  if(apkInstallReady()) downloadAndInstallUpdate(rel, btn, statusEl);
  else applyPwaUpdate(rel, btn, statusEl);
}
/* Downloads the release APK straight into the app's cache dir, then hands
   it to Android's own package installer — the same "sideload" install
   prompt as before, just without the user having to leave the app, find
   the file in Downloads, and open it themselves. Android still requires a
   final tap to actually install (no app can silently replace itself), and
   the very first time it also requires the user to grant "install unknown
   apps" for Office Ledger specifically — handled below. */
async function downloadAndInstallUpdate(rel, btn, statusEl){
  if(!apkInstallReady() || !rel.apkUrl){
    openExternal(rel.url);
    return;
  }
  var originalLabel = btn ? btn.textContent : "";
  try{
    if(btn){ btn.disabled = true; btn.textContent = "Downloading…"; }
    if(statusEl) statusEl.textContent = "Downloading "+rel.apkName+"…";
    var dl = await window.Capacitor.Plugins.Filesystem.downloadFile({
      url: rel.apkUrl, path: "update.apk", directory: "CACHE"
    });
    if(statusEl) statusEl.textContent = "Opening installer…";
    await window.Capacitor.Plugins.ApkInstaller.install({ path: dl.path });
    if(statusEl) statusEl.textContent = "Follow the prompt to finish installing "+rel.tag+".";
  }catch(e){
    console.warn("Office Ledger: update download/install failed", e);
    var reason = (e && (e.message||e.errorMessage)) || "";
    if(/install_unknown_apps/i.test(reason)){
      if(statusEl) statusEl.textContent = "Allow \"Install unknown apps\" for Office Ledger in the settings screen that just opened, then tap Update again.";
    } else {
      if(statusEl) statusEl.textContent = "Couldn't download the update — opening the release page instead.";
      openExternal(rel.url);
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = originalLabel || "Update now"; }
  }
}
async function checkForUpdate(){
  var statusEl = document.getElementById("updateStatus");
  var btn = document.getElementById("checkUpdateBtn");
  var openBtn = document.getElementById("openReleaseBtn");
  if(statusEl) statusEl.textContent = "Checking…";
  if(btn) btn.disabled = true;
  try{
    var rel = await fetchLatestRelease();
    if(rel.tag && compareVersions(rel.tag, APP_VERSION) > 0){
      if(statusEl) statusEl.innerHTML = "Version <b>"+esc(rel.tag)+"</b> is available — you're on "+esc(APP_VERSION)+".";
      if(openBtn){
        openBtn.classList.remove("hidden");
        openBtn.textContent = apkInstallReady() ? "Update now" : "Update the app";
        openBtn.onclick = function(){ handleUpdateAction(rel, openBtn, statusEl); };
      }
      notifyUpdateAvailable(rel.tag);
    } else {
      if(statusEl) statusEl.textContent = "You're on the latest version ("+esc(APP_VERSION)+").";
      if(openBtn) openBtn.classList.add("hidden");
    }
  }catch(e){
    console.warn("Office Ledger: update check failed", e);
    if(statusEl) statusEl.textContent = "Couldn't check for updates — check your connection and try again.";
  } finally {
    if(btn) btn.disabled = false;
  }
}
// Silent background check, run once at startup and throttled to at most
// once every 12h — surfaces a notification without the user having to
// open About and tap "Check for updates" themselves.
async function checkForUpdateAuto(){
  try{
    if(!state) return;
    var last = state.lastUpdateCheck || 0;
    if(Date.now() - last < 12*60*60*1000) return;
    state.lastUpdateCheck = Date.now();
    saveState();
    var rel = await fetchLatestRelease();
    if(rel.tag && compareVersions(rel.tag, APP_VERSION) > 0) notifyUpdateAvailable(rel.tag);
  }catch(e){ console.warn("Office Ledger: silent update check failed", e); }
}
/* Closes the loop on "did the update actually land?" — especially for the
   PWA, which has no install confirmation step the way the Android app's
   package installer does. Compares the version stored last run to the
   one actually running now: different means an update landed since the
   last open, so it gets a one-time toast. Same version, or no prior
   value at all (a brand-new install, or a save from before this existed)
   stays quiet — there's nothing to confirm yet. */
function checkVersionChanged(){
  if(!state) return;
  var prev = state.lastSeenVersion;
  if(prev && prev !== APP_VERSION) showToast("Updated to v"+APP_VERSION);
  if(prev !== APP_VERSION){ state.lastSeenVersion = APP_VERSION; saveState(); }
}

/* ---------- Onboarding ---------- */
/* First-launch onboarding is a short multi-step wizard — a welcome slide,
   a how-it-works slide, a what-you-can-track slide, then the actual profile
   setup form on the last step. Purely presentational steps can be skipped
   straight to setup; the form step can't, since the app needs that data.
   Submitting the form on the last step does the same thing the old
   single-screen onboarding always did. */
var obStep = 0;
function obFeature(color, title, text){
  return '<div class="ob-feature">'+
    '<span class="ob-feature-dot" style="background:'+color+';"></span>'+
    '<div><div class="ob-feature-title">'+title+'</div><div class="ob-feature-text">'+text+'</div></div>'+
  '</div>';
}
var OB_SLIDES = [
  { render:function(){
    return '<svg class="onboard-mark" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4"></rect><line x1="3" y1="9" x2="21" y2="9"></line><polyline points="8 14.5 11 17.5 16.5 10.5"></polyline></svg>'+
      '<div>'+
        '<div class="eyebrow">Welcome</div>'+
        '<h1 style="font-size:26px; margin-top:4px;">Office Ledger</h1>'+
        '<p class="subtext" style="margin-top:8px;">Built for ANZ employees to track office attendance against the company’s hybrid-work target. Log your days, leave, public holidays and comp off, and watch your percentage update live. Everything stays on this device.</p>'+
      '</div>';
  }},
  { render:function(){
    return '<div>'+
        '<div class="eyebrow">How it works</div>'+
        '<h1 style="font-size:23px; margin-top:4px;">One simple formula</h1>'+
        '<p class="subtext" style="margin-top:8px;">The financial year runs 1 October – 30 September. Every day you log feeds straight into this:</p>'+
      '</div>'+
      '<div class="formula-box">attendance % =<br>&nbsp;&nbsp;days present ÷ eligible working days × 100<br><br>eligible working days =<br>&nbsp;&nbsp;working days − leave − public holidays − comp off</div>';
  }},
  { render:function(){
    return '<div><div class="eyebrow">What you can track</div><h1 style="font-size:23px; margin-top:4px;">Everything, in one tap</h1></div>'+
      '<div class="ob-feature-list">'+
        obFeature("var(--good)","Present or Work from home","Mark each weekday from the Calendar tab.")+
        obFeature("var(--warn)","Annual &amp; Sick/Carer leave","Two separate pools, reported monthly — the app works out the days taken from the drop.")+
        obFeature("var(--holiday)","Public holidays","Add your company’s list once a year and they’re excluded automatically.")+
        obFeature("var(--accent)","Comp off","Earned on worked weekends, spent when you take it.")+
      '</div>';
  }},
  { render:function(){
    return '<div><div class="eyebrow">Almost there</div><h1 style="font-size:23px; margin-top:4px;">Set up your profile</h1></div>'+
      '<form id="onboardForm" style="gap:12px;">'+
        '<div class="field"><label for="obName">Your name</label><input type="text" id="obName" placeholder="e.g. Debarun" required></div>'+
        '<div class="field"><label for="obTarget">Attendance target (%)</label><input type="number" id="obTarget" min="0" max="100" value="50" required></div>'+
        '<div class="field"><label for="obCompOff">Current comp off balance (days)</label><input type="number" id="obCompOff" min="0" step="0.5" value="0"></div>'+
      '</form>';
  }}
];
function renderOnboard(){
  obStep = 0;
  var shell =
    '<div class="onboard-inner">'+
      '<div class="ob-topbar">'+
        '<div class="ob-dots" id="obDots"></div>'+
        '<button class="ob-skip" id="obSkip">Skip intro</button>'+
      '</div>'+
      '<div class="ob-slide" id="obSlide"></div>'+
      '<div class="ob-nav" id="obNav"></div>'+
    '</div>';
  document.getElementById("onboard").innerHTML = shell;
  document.getElementById("obSkip").addEventListener("click", function(){ goToObStep(OB_SLIDES.length-1); });
  renderObStep();
}
function goToObStep(n){
  obStep = Math.max(0, Math.min(OB_SLIDES.length-1, n));
  renderObStep();
}
function renderObStep(){
  var isLast = obStep===OB_SLIDES.length-1;
  var dots = document.getElementById("obDots");
  dots.innerHTML = OB_SLIDES.map(function(_,i){ return '<span class="ob-dot'+(i===obStep?' on':'')+'"></span>'; }).join("");
  document.getElementById("obSkip").classList.toggle("hidden", isLast);

  var slide = document.getElementById("obSlide");
  slide.classList.remove("ob-slide"); void slide.offsetWidth; slide.classList.add("ob-slide"); // restart fade-in
  slide.innerHTML = OB_SLIDES[obStep].render();

  document.getElementById("obNav").innerHTML =
    (obStep>0 ? '<button class="btn btn-secondary" id="obBack" type="button">Back</button>' : '<span></span>')+
    '<button class="btn btn-primary" id="obNext" type="'+(isLast?'submit':'button')+'"'+(isLast?' form="onboardForm"':'')+'>'+(isLast?"Start tracking":"Next")+'</button>';
  var backBtn = document.getElementById("obBack");
  if(backBtn) backBtn.addEventListener("click", function(){ goToObStep(obStep-1); });
  if(!isLast){
    document.getElementById("obNext").addEventListener("click", function(){ goToObStep(obStep+1); });
  } else {
    document.getElementById("onboardForm").addEventListener("submit", function(e){
      e.preventDefault();
      var name = document.getElementById("obName").value.trim();
      var tgt = parseInt(document.getElementById("obTarget").value,10);
      var co = parseFloat(document.getElementById("obCompOff").value);
      state = defaultState();
      state.profile.name = name;
      state.profile.targetPct = isNaN(tgt)?50:Math.max(0,Math.min(100,tgt));
      state.profile.openingCompOff = isNaN(co)?0:co;
      saveState();
      document.getElementById("onboard").classList.add("hidden");
      switchView("today");
      checkForUpdateAuto(); // init() ran before state existed, so this session's first check happens here instead
    });
  }
}

/* ---------- pull-to-refresh ----------
   Reloads state fresh from device storage and re-renders the current view —
   covers the (rare) case data changed outside this running instance (an
   import, or another entry point), and gives a visible confirmation that
   the numbers on screen are live, not a cached snapshot. Only arms when
   the page is already scrolled to the very top, so it never fights normal
   scrolling further down a view. */
function setupPullToRefresh(){
  var ptrBar = document.getElementById("ptrBar");
  var ptrLabel = document.getElementById("ptrLabel");
  if(!ptrBar || !ptrLabel) return;
  var THRESHOLD = 64;
  var startY = null, pulling = false, refreshing = false;

  function setHeight(px){
    ptrBar.style.height = px+"px";
    ptrBar.style.opacity = String(Math.min(1, px/THRESHOLD));
  }
  document.addEventListener("touchstart", function(e){
    if(refreshing || tour.active || (window.scrollY||0) > 0){ startY=null; pulling=false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
  }, {passive:true});
  document.addEventListener("touchmove", function(e){
    if(!pulling || startY===null || refreshing) return;
    if((window.scrollY||0) > 0){ pulling=false; setHeight(0); return; }
    var dy = e.touches[0].clientY - startY;
    if(dy<=0){ setHeight(0); return; }
    var damped = Math.min(THRESHOLD*1.5, dy*0.5);
    setHeight(damped);
    ptrLabel.textContent = damped>=THRESHOLD ? "Release to refresh" : "Pull to refresh";
  }, {passive:true});
  document.addEventListener("touchend", function(){
    if(!pulling || refreshing){ pulling=false; return; }
    pulling=false;
    var h = parseFloat(ptrBar.style.height)||0;
    if(h>=THRESHOLD) doRefresh();
    else setHeight(0);
  }, {passive:true});

  async function doRefresh(){
    refreshing = true;
    ptrLabel.textContent = "Refreshing…";
    setHeight(THRESHOLD*0.85);
    var startedAt = Date.now();
    try{
      var fresh = await loadState();
      if(fresh) state = fresh;
    }catch(e){ console.warn("Office Ledger: refresh failed", e); }
    renderCurrentView();
    if(nativeNotifReady()) sendPendingNotifications();
    var wait = Math.max(0, 400 - (Date.now()-startedAt));
    setTimeout(function(){ setHeight(0); refreshing=false; }, wait);
  }
}

/* ---------- init ---------- */
async function init(){
  state = await loadState();
  document.querySelectorAll(".navbtn").forEach(function(b){
    b.addEventListener("click", function(){ switchView(b.getAttribute("data-view")); });
  });
  document.getElementById("fyChip").textContent = fyOf(today()).label;
  document.getElementById("helpBtn").addEventListener("click", function(){ startTour(currentView); });
  document.getElementById("notifBtn").addEventListener("click", openNotifCenter);
  updateNotifBadge();
  setupBackfillTrigger();
  setupPullToRefresh();
  syncStatusBar();
  checkForUpdateAuto();
  if(window.matchMedia){
    var darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
    if(darkModeQuery.addEventListener) darkModeQuery.addEventListener("change", syncStatusBar);
    else if(darkModeQuery.addListener) darkModeQuery.addListener(syncStatusBar); // older WebViews
  }
  if(!state){
    document.getElementById("onboard").classList.remove("hidden");
    renderOnboard();
  } else {
    switchView("today");
    checkVersionChanged();
    sendPendingNotifications();
    scheduleWfhReminders();
    checkOfficeLocationAuto();
    maybeShowGpsCelebration();
  }
  // Re-check location and the GPS celebration reveal whenever the app comes
  // back to the foreground — not just on a fresh cold start. Covers both a
  // PWA tab regaining focus and, on Android, the app being brought forward
  // from the recent-apps/task switcher rather than freshly launched (that's
  // what "resume" is here; "visibilitychange" covers the same case in the
  // WebView and doubles as the PWA/browser-tab path).
  function onAppForeground(){
    if(!state) return;
    checkOfficeLocationAuto();
    maybeShowGpsCelebration();
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible") onAppForeground();
  });
  document.addEventListener("resume", onAppForeground);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
</script>
